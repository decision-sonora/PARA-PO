<!DOCTYPE html>
<html>
<head>
    <title>PARA-PO Passenger App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial; margin: 0; display: flex; height: 100vh; background: #f4f4f9; }
        #sidebar { width: 320px; padding: 20px; background: #1e1e2f; color: white; z-index: 1000; display: flex; flex-direction: column; }
        #map { flex-grow: 1; }
        .card { background: #27293d; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #00f2c3; }
        .ping-btn { background: #fd5d93; color: white; border: none; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold;}
        #alert-box { display: none; background: #00f2c3; color: #1e1e2f; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; text-align: center; animation: pulse 1.5s infinite; }
        select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; font-size: 16px;}
        .sms-box { font-size: 12px; color: #aaa; margin-top: 10px; text-align: center; }
        
        #chat-container { position: absolute; bottom: 20px; right: 20px; width: 320px; background: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; z-index: 2000; overflow: hidden; }
        #chat-header { background: #1e1e2f; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; }
        #chat-messages { height: 300px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .msg { padding: 10px; border-radius: 8px; max-width: 80%; font-size: 14px; }
        .msg.bot { background: #e0e0e0; align-self: flex-start; color: #333; }
        .msg.user { background: #00f2c3; align-self: flex-end; color: #1e1e2f; }
        #chat-input-area { display: flex; padding: 10px; border-top: 1px solid #ccc; background: white; }
        #chat-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        #send-btn { background: #1e1e2f; color: white; border: none; padding: 10px 15px; margin-left: 10px; border-radius: 20px; cursor: pointer; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>PARA-PO Live</h2>
        <div id="alert-box">🚨 Jeepney is nearby! Look outside!</div>
        
        <select id="route-filter" onchange="renderSidebar()">
            <option value="ALL">Show All Routes</option>
            <option value="AYALA">Ayala Route Only</option>
            <option value="SINNUNUC">Sinnunuc Route Only</option>
        </select>

        <div id="jeepney-list" style="flex-grow:1; overflow-y:auto;">Searching...</div>
        <div class="sms-box">No Data? Text "AYALA" to 0917-123-4567</div>
    </div>
    <div id="map"></div>

    <div id="chat-container">
        <div id="chat-header">
            <span>🤖 PARA-PO AI Assistant</span>
            <span style="cursor:pointer;" onclick="document.getElementById('chat-container').style.display='none'">✖</span>
        </div>
        <div id="chat-messages">
            <div class="msg bot">Mabuhay! Hello! Ask me about fares, routes, or where the jeepneys are!</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([6.9273, 122.0588], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        const markers = {};
        let activeData = {}; 
        let passengerLatLng = null;
        const socket = io();

        socket.on('jeepney_update', (data) => {
            activeData[data.plate] = data;
            if (markers[data.plate]) {
                markers[data.plate].setLatLng([data.lat, data.lon]);
            } else {
                const icon = L.divIcon({ html: '🚐', iconSize: [30, 30], className: '' });
                markers[data.plate] = L.marker([data.lat, data.lon], {icon: icon}).addTo(map).bindPopup(`Plate: ${data.plate}`);
            }
            renderSidebar();
            checkGeofence();
        });

        socket.on('passenger_update', (data) => {
            passengerLatLng = [data.lat, data.lon];
            const icon = L.divIcon({ html: '🧍', iconSize: [30, 30], className: '' });
            if(window.myMarker) map.removeLayer(window.myMarker);
            window.myMarker = L.marker([data.lat, data.lon], {icon: icon}).addTo(map).bindPopup("You are here");
            checkGeofence();
        });

        socket.on('ping_acknowledged', (data) => {
            alert(`✅ Driver of jeepney ${data.plate} has seen your request and is on the way!`);
        });

        function renderSidebar() {
            const filter = document.getElementById('route-filter').value;
            let html = '';
            for (let plate in activeData) {
                if (filter === 'ALL' || activeData[plate].route === filter) {
                    html += `
                    <div class="card">
                        <strong>Plate: ${plate}</strong><br>
                        Route: ${activeData[plate].route}<br>
                        <button class="ping-btn" onclick="pingDriver('${plate}', ${activeData[plate].lat}, ${activeData[plate].lon})">
                            📢 Ping Driver
                        </button>
                    </div>`;
                }
            }
            document.getElementById('jeepney-list').innerHTML = html || "No jeepneys on this route.";
        }

        function checkGeofence() {
            if (!passengerLatLng) return;
            let nearby = false;
            for (let plate in activeData) {
                const jLat = activeData[plate].lat;
                const jLon = activeData[plate].lon;
                const R = 6371000; 
                const dLat = (jLat - passengerLatLng[0]) * Math.PI / 180;
                const dLon = (jLon - passengerLatLng[1]) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(passengerLatLng[0] * Math.PI / 180) * Math.cos(jLat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                const dist = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
                if (dist <= 100) nearby = true;
            }
            document.getElementById('alert-box').style.display = nearby ? 'block' : 'none';
        }

        function pingDriver(plate, lat, lon) {
            socket.emit('passenger_ping', { plate: plate, lat: lat, lon: lon });
            alert("Ping sent to driver!");
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            const typingId = 'typing-' + Date.now();
            addMessage('Typing...', 'bot', typingId);

            try {
                const res = await fetch('/api/ask-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                document.getElementById(typingId).remove();
                addMessage(data.reply || data.error, 'bot');
            } catch (err) {
                document.getElementById(typingId).remove();
                addMessage("Network error.", 'bot');
            }
        }

        function addMessage(text, sender, id = '') {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            if(id) div.id = id;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
