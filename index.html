<!DOCTYPE html>
<html>
<head>
    <title>PARA-PO Passenger App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial; margin: 0; display: flex; height: 100vh; background: #f4f4f9; }
        #sidebar { width: 340px; padding: 20px; background: #1e1e2f; color: white; z-index: 1000; display: flex; flex-direction: column; }
        #map { flex-grow: 1; }
        .card { background: #27293d; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #00f2c3; }
        .ping-btn { background: #fd5d93; color: white; border: none; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold;}
        
        /* Boarding Button */
        #board-btn { display: none; background: #00f2c3; color: #1e1e2f; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; margin-top: 15px; animation: pulse 1s infinite; }
        
        #alert-box { display: none; background: #00f2c3; color: #1e1e2f; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        
        .loc-btn { background: #27293d; color: white; border: 1px solid #00f2c3; padding: 10px; border-radius: 5px; cursor: pointer; flex: 1; margin: 0 5px; font-size: 12px;}
        .loc-btn:hover { background: #00f2c3; color: #1e1e2f; }
        #search-container { display: flex; margin-bottom: 10px; }
        #location-search { flex-grow: 1; padding: 10px; border-radius: 5px 0 0 5px; border: none; outline: none; }
        #search-btn { background: #00f2c3; color: #1e1e2f; border: none; padding: 10px 15px; border-radius: 0 5px 5px 0; cursor: pointer; font-weight: bold; }
        .loc-controls { display: flex; margin-bottom: 15px; }
        
        #chat-toggle { position: absolute; bottom: 20px; right: 20px; background: #1e1e2f; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; cursor: pointer; z-index: 3000; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #chat-container { display: none; position: absolute; bottom: 90px; right: 20px; width: 320px; background: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); flex-direction: column; z-index: 2000; overflow: hidden; }
        #chat-header { background: #1e1e2f; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; }
        #chat-messages { height: 300px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .msg { padding: 10px; border-radius: 8px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .msg.bot { background: #e0e0e0; align-self: flex-start; color: #333; }
        .msg.user { background: #00f2c3; align-self: flex-end; color: #1e1e2f; }
        #chat-input-area { display: flex; padding: 10px; border-top: 1px solid #ccc; background: white; }
        #chat-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        #send-btn { background: #1e1e2f; color: white; border: none; padding: 10px 15px; margin-left: 10px; border-radius: 20px; cursor: pointer; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>PARA-PO Live</h2>
        
        <div id="search-container">
            <input type="text" id="location-search" placeholder="Search location..." onkeypress="handleSearchEnter(event)">
            <button id="search-btn" onclick="searchLocation()">🔍</button>
        </div>
        
        <div class="loc-controls">
            <button class="loc-btn" onclick="autoLocate()">📍 Auto Locate</button>
            <button class="loc-btn" id="manual-btn" onclick="enableManualLocate()">👆 Click Map</button>
        </div>

        <div id="alert-box">🚨 Jeepney is nearby! Look outside!</div>
        <div id="jeepney-list" style="flex-grow:1; overflow-y: auto;">Searching...</div>
        
        <!-- Boarding Button -->
        <button id="board-btn" onclick="confirmBoard()">✅ I Have Boarded</button>
    </div>
    <div id="map"></div>

    <button id="chat-toggle" onclick="toggleChat()">💬</button>

    <div id="chat-container">
        <div id="chat-header">
            <span>🤖 PARA-PO AI Assistant</span>
            <span style="cursor:pointer;" onclick="toggleChat()">✖</span>
        </div>
        <div id="chat-messages">
            <div class="msg bot">Mabuhay! Hello! Ask me about fares, routes, or where the jeepneys are!</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([6.9273, 122.0588], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        const markers = {};
        const geofences = {};
        let activeData = {}; 
        let passengerLatLng = null;
        let myMarker = null; 
        let manualMode = false;
        
        let activePingPlate = null; // Tracks which jeepney we are pinging
        let pingLine = null;        // The live tracking line
        let currentJeepPos = null;  // Live position of the targeted jeepney

        const socket = io();

        // --- Private Location System ---
        function setMyLocation(lat, lon) {
            passengerLatLng = [lat, lon];
            const icon = L.divIcon({ html: '🧍', iconSize: [30, 30], className: '' });
            if (myMarker) map.removeLayer(myMarker);
            myMarker = L.marker([lat, lon], {icon: icon}).addTo(map).bindPopup("You are here");
            
            socket.emit('passenger_location_update', { lat: lat, lon: lon });
            checkGeofence();
        }

        function autoLocate() {
            if (!navigator.geolocation) return alert("Geolocation not supported.");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    setMyLocation(pos.coords.latitude, pos.coords.longitude);
                    map.setView([pos.coords.latitude, pos.coords.longitude], 16);
                },
                (err) => alert("Could not get location. Please use click map.")
            );
        }

        function enableManualLocate() {
            manualMode = true;
            document.getElementById('manual-btn').style.background = "#00f2c3";
            document.getElementById('manual-btn').style.color = "#1e1e2f";
        }

        map.on('click', (e) => {
            if (manualMode) {
                setMyLocation(e.latlng.lat, e.latlng.lng);
                manualMode = false;
                document.getElementById('manual-btn').style.background = "";
                document.getElementById('manual-btn').style.color = "";
            }
        });

        function handleSearchEnter(e) { if (e.key === 'Enter') searchLocation(); }

        async function searchLocation() {
            const query = document.getElementById('location-search').value;
            if (!query) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Zamboanga City')}`);
                const data = await res.json();
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    setMyLocation(lat, lon);
                    map.setView([lat, lon], 16);
                } else {
                    alert("Location not found.");
                }
            } catch (err) { alert("Error searching."); }
        }

        // --- Ping & Tracking System ---
        function pingDriver(plate) {
            if(!passengerLatLng) return alert("Please set your location first.");
            
            activePingPlate = plate;
            currentJeepPos = [activeData[plate].lat, activeData[plate].lon];
            
            socket.emit('passenger_ping', { plate: plate, passLat: passengerLatLng[0], passLon: passengerLatLng[1] });
            
            // Draw live tracking line
            if (pingLine) map.removeLayer(pingLine);
            pingLine = L.polyline([passengerLatLng, currentJeepPos], {color: '#fd5d93', weight: 4, dashArray: '10, 10'}).addTo(map);
            updateLineDistance();

            // Show the Board Button
            document.getElementById('board-btn').style.display = 'block';
        }

        function updateLineDistance() {
            if(!pingLine || !passengerLatLng || !currentJeepPos) return;
            const dist = map.distance(passengerLatLng, currentJeepPos);
            pingLine.bindTooltip(`${Math.round(dist)} meters away`, {permanent: true, direction: "center", className: "dist-tooltip"}).openTooltip();
        }

        function confirmBoard() {
            if(!activePingPlate) return;
            socket.emit('passenger_board', { plate: activePingPlate });
            alert("You have boarded the jeepney! The driver's capacity has been updated.");
            
            // Cleanup tracking
            if(pingLine) map.removeLayer(pingLine);
            pingLine = null;
            activePingPlate = null;
            document.getElementById('board-btn').style.display = 'none';
        }

        // --- Real-time Listeners ---
        socket.on('initial_jeepneys', (data) => { for (let plate in data) handleJeepneyUpdate(data[plate]); });
        socket.on('jeepney_update', (data) => handleJeepneyUpdate(data));
        socket.on('test_jeepney_update', (data) => handleJeepneyUpdate(data));

        socket.on('test_jeepney_deleted', (plate) => {
            if (markers[plate]) map.removeLayer(markers[plate]);
            if (geofences[plate]) map.removeLayer(geofences[plate]);
            delete markers[plate]; delete geofences[plate]; delete activeData[plate];
            renderSidebar();
        });

        socket.on('ping_acknowledged', (data) => {
            alert(`✅ Driver of jeepney ${data.plate} has seen your request!`);
        });

        function handleJeepneyUpdate(data) {
            activeData[data.plate] = data;
            if (markers[data.plate]) markers[data.plate].setLatLng([data.lat, data.lon]);
            else {
                const icon = L.divIcon({ html: '🚐', iconSize: [30, 30], className: '' });
                markers[data.plate] = L.marker([data.lat, data.lon], {icon: icon}).addTo(map).bindPopup(`Plate: ${data.plate}`);
            }
            if (geofences[data.plate]) map.removeLayer(geofences[data.plate]);
            geofences[data.plate] = L.circle([data.lat, data.lon], { color: '#00f2c3', fillColor: '#00f2c3', fillOpacity: 0.2, radius: 100 }).addTo(map);
            
            // If this is the jeepney we are tracking, update the line
            if (data.plate === activePingPlate) {
                currentJeepPos = [data.lat, data.lon];
                if (pingLine) {
                    pingLine.setLatLngs([passengerLatLng, currentJeepPos]);
                    updateLineDistance();
                }
            }
            
            renderSidebar();
            checkGeofence();
        }

        function renderSidebar() {
            let html = '';
            for (let plate in activeData) {
                html += `
                <div class="card">
                    <strong>Plate: ${plate}</strong><br>
                    Route: ${activeData[plate].route}<br>
                    <button class="ping-btn" onclick="pingDriver('${plate}')">📢 Ping Driver</button>
                </div>`;
            }
            document.getElementById('jeepney-list').innerHTML = html || "No jeepneys active.";
        }

        function checkGeofence() {
            if (!passengerLatLng) return;
            let nearby = false;
            for (let plate in activeData) {
                const dist = map.distance(passengerLatLng, [activeData[plate].lat, activeData[plate].lon]);
                if (dist <= 100) nearby = true;
            }
            document.getElementById('alert-box').style.display = nearby ? 'block' : 'none';
        }

        // ==================== CHATBOT ====================
        function toggleChat() {
            const chat = document.getElementById('chat-container');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            const typingId = 'typing-' + Date.now();
            addMessage('Typing...', 'bot', typingId);

            try {
                const res = await fetch('/api/ask-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                document.getElementById(typingId).remove();
                addMessage(data.reply || data.error, 'bot');
            } catch (err) {
                document.getElementById(typingId).remove();
                addMessage("Network error.", 'bot');
            }
        }

        function addMessage(text, sender, id = '') {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            if(id) div.id = id;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
