<!DOCTYPE html>
<html>
<head>
    <title>PARA-PO Passenger App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: rgba(30, 30, 30, 0.85);
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-green: #a3e635;
            --accent-red: #ef4444;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            background: var(--bg-dark); 
            color: var(--text-primary);
            overflow: hidden;
        }

        #map { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1;
            filter: brightness(0.85) contrast(1.1);
        }

        #sidebar { 
            position: absolute;
            top: 20px;
            left: 20px;
            bottom: 20px;
            width: 360px; 
            background: var(--panel-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 24px; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s ease;
        }
        
        h2 { margin-top: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
        h2::before { content: ''; display: block; width: 12px; height: 12px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }

        .card { 
            background: var(--card-bg); 
            padding: 16px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .card:hover { transform: translateY(-2px); border-color: #444; }
        .card strong { font-size: 15px; display: block; margin-bottom: 4px;}
        .card span { font-size: 13px; color: var(--text-secondary); }
        
        .ping-btn, .loc-btn, #search-btn, #send-btn { 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #444; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .ping-btn:hover, .loc-btn:hover, #search-btn:hover { background: #333; border-color: #555; }
        
        .ping-btn { width: 100%; margin-top: 12px; color: var(--accent-green); border-color: rgba(163, 230, 53, 0.3); }
        .ping-btn:hover { background: rgba(163, 230, 53, 0.1); }

        #board-btn { display: none; background: var(--accent-green); color: #000; border: none; padding: 16px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 16px; margin-top: 15px; transition: 0.2s;}
        #board-btn:hover { background: #bcf258; transform: scale(1.02); }
        
        #disembark-btn { display: none; background: var(--accent-red); color: white; border: none; padding: 20px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 18px; margin-top: 15px; animation: pulseRed 2s infinite; }
        
        #alert-box { display: none; background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 16px; border-radius: 8px; font-weight: 600; margin-bottom: 15px; text-align: center; }
        
        #search-container { display: flex; margin-bottom: 12px; }
        #location-search { flex-grow: 1; padding: 12px 16px; border-radius: 8px 0 0 8px; border: 1px solid var(--border-color); border-right: none; outline: none; background: #1a1a1a; color: white; font-family: 'Inter', sans-serif;}
        #search-btn { border-radius: 0 8px 8px 0; padding: 0 16px; }
        .loc-controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .loc-btn { flex: 1; padding: 10px; font-size: 12px;}
        .loc-btn.active { background: rgba(163, 230, 53, 0.2); border-color: var(--accent-green); color: var(--accent-green); }

        #chat-toggle { position: absolute; bottom: 30px; right: 30px; background: #1e1e1e; color: var(--accent-green); border: 1px solid #333; border-radius: 50%; width: 60px; height: 60px; font-size: 24px; cursor: pointer; z-index: 3000; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: 0.3s;}
        #chat-toggle:hover { background: #2a2a2a; transform: scale(1.1); }
        
        #chat-container { display: none; position: absolute; bottom: 100px; right: 30px; width: 340px; background: var(--panel-bg); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 15px 40px rgba(0,0,0,0.6); flex-direction: column; z-index: 2000; overflow: hidden; }
        #chat-header { background: rgba(0,0,0,0.3); color: white; padding: 16px; font-weight: 600; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color);}
        #chat-messages { height: 300px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .msg.bot { background: #2a2a2a; align-self: flex-start; color: #ddd; border-bottom-left-radius: 4px;}
        .msg.user { background: rgba(163, 230, 53, 0.15); color: var(--accent-green); border: 1px solid rgba(163, 230, 53, 0.2); align-self: flex-end; border-bottom-right-radius: 4px;}
        #chat-input-area { display: flex; padding: 12px; border-top: 1px solid var(--border-color); background: #1a1a1a; }
        #chat-input { flex-grow: 1; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; background: #121212; color: white; font-family: 'Inter', sans-serif;}
        #send-btn { margin-left: 10px; padding: 0 16px; background: var(--accent-green); color: black; border: none; }
        
        .custom-jeep-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .jeep-name { font-weight: 700; color: var(--accent-green); background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap; margin-bottom: 2px;}
        .jeep-emoji { font-size: 30px; line-height: 25px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        /* --- BULLETPROOF MOBILE RESPONSIVENESS FIX --- */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed; /* Changed to fixed to stay anchored to viewport */
                top: auto;
                bottom: 0;
                left: 0;
                width: 100vw;
                height: 55vh; /* Takes bottom half of screen */
                border-radius: 20px 20px 0 0;
                box-sizing: border-box;
                border: none;
                border-top: 1px solid var(--border-color);
                z-index: 9999; /* Forces it above everything else */
                padding: 15px;
                background: #1a1a1a; /* Solid fallback so map doesn't bleed through */
            }
            #map {
                height: 100vh;
            }
            #chat-container {
                position: fixed;
                bottom: 0;
                right: 0;
                width: 100vw;
                height: 65vh;
                border-radius: 20px 20px 0 0;
                z-index: 10000; /* Above sidebar */
            }
            #chat-toggle {
                bottom: 57vh; /* Moves above the bottom sheet */
                right: 15px;
                width: 50px;
                height: 50px;
                z-index: 10001;
            }
            .leaflet-bottom.leaflet-right {
                bottom: 55vh; /* Pushes map zoom controls up */
            }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>PARA-PO Live</h2>
        
        <div id="normal-controls">
            <div id="search-container">
                <input type="text" id="location-search" placeholder="Search location..." onkeypress="handleSearchEnter(event)">
                <button id="search-btn" onclick="searchLocation()">🔍</button>
            </div>
            
            <div class="loc-controls">
                <button class="loc-btn" onclick="autoLocate()">📍 Auto Locate</button>
                <button class="loc-btn" id="manual-btn" onclick="enableManualLocate()">👆 Click Map</button>
            </div>
        </div>

        <div id="alert-box">🚨 Jeepney is nearby! Look outside!</div>
        <div id="jeepney-list" style="flex-grow:1; overflow-y: auto;">Searching...</div>
        
        <button id="board-btn" onclick="confirmBoard()">✅ I Have Boarded</button>
        <button id="disembark-btn" onclick="confirmDisembark()">🚪 Board Off / Disembark</button>
    </div>
    <div id="map"></div>

    <button id="chat-toggle" onclick="toggleChat()">💬</button>

    <div id="chat-container">
        <div id="chat-header">
            <span>🤖 PARA-PO AI</span>
            <span style="cursor:pointer; color: #888;" onclick="toggleChat()">✖</span>
        </div>
        <div id="chat-messages">
            <div class="msg bot">Mabuhay! I am your PARA-PO assistant. Ask me about fares, routes, or where the jeepneys are!</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([6.9273, 122.0588], 14);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        const markers = {};
        const geofences = {};
        let activeData = {}; 
        let passengerLatLng = null;
        let myMarker = null; 
        let manualMode = false;
        
        let isBoarded = false;
        let boardedJeepneyPlate = null;
        let activePingPlate = null; 
        let pingLine = null;        
        let currentJeepPos = null;  

        const socket = io();

        function getJeepneyIcon(plate) {
            return L.divIcon({
                html: `<div class="custom-jeep-icon"><div class="jeep-name">${plate}</div><div class="jeep-emoji">🚐</div></div>`,
                iconSize: [80, 50],
                className: ''
            });
        }

        function setMyLocation(lat, lon) {
            passengerLatLng = [lat, lon];
            const icon = L.divIcon({ html: '<div style="font-size: 30px; filter: drop-shadow(0 0 5px #a3e635);">🧍</div>', iconSize: [30, 30], className: '' });
            if (myMarker) map.removeLayer(myMarker);
            myMarker = L.marker([lat, lon], {icon: icon}).addTo(map).bindPopup("You are here");
            
            socket.emit('passenger_location_update', { lat: lat, lon: lon });
            checkGeofence();
        }

        function autoLocate() {
            if (!navigator.geolocation) return alert("Geolocation not supported.");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    setMyLocation(pos.coords.latitude, pos.coords.longitude);
                    map.setView([pos.coords.latitude, pos.coords.longitude], 16);
                },
                (err) => alert("Could not get location. Please use click map.")
            );
        }

        function enableManualLocate() {
            manualMode = true;
            document.getElementById('manual-btn').classList.add('active');
        }

        map.on('click', (e) => {
            if (manualMode) {
                setMyLocation(e.latlng.lat, e.latlng.lng);
                manualMode = false;
                document.getElementById('manual-btn').classList.remove('active');
            }
        });

        function handleSearchEnter(e) { if (e.key === 'Enter') searchLocation(); }

        async function searchLocation() {
            if (isBoarded) return;
            const query = document.getElementById('location-search').value;
            if (!query) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Zamboanga City')}`);
                const data = await res.json();
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    setMyLocation(lat, lon);
                    map.setView([lat, lon], 16);
                } else {
                    alert("Location not found.");
                }
            } catch (err) { alert("Error searching."); }
        }

        function pingDriver(plate) {
            if(isBoarded) return;
            if(!passengerLatLng) return alert("Please set your location first.");
            
            activePingPlate = plate;
            currentJeepPos = [activeData[plate].lat, activeData[plate].lon];
            
            socket.emit('passenger_ping', { plate: plate, passLat: passengerLatLng[0], passLon: passengerLatLng[1] });
            
            if (pingLine) map.removeLayer(pingLine);
            pingLine = L.polyline([passengerLatLng, currentJeepPos], {color: '#a3e635', weight: 3, dashArray: '8, 8'}).addTo(map);
            updateLineDistance();

            document.getElementById('board-btn').style.display = 'block';
        }

        function updateLineDistance() {
            if(!pingLine || !passengerLatLng || !currentJeepPos) return;
            const dist = map.distance(passengerLatLng, currentJeepPos);
            
            const etaMinutes = Math.max(1, Math.ceil(dist / 333));
            const label = `~${etaMinutes} min (${Math.round(dist)}m)`;
            
            pingLine.bindTooltip(label, {
                permanent: true, 
                direction: "center", 
                className: "dist-tooltip"
            }).openTooltip();
        }

        function confirmBoard() {
            if(!activePingPlate) return;
            socket.emit('passenger_board', { plate: activePingPlate });
            
            isBoarded = true;
            boardedJeepneyPlate = activePingPlate;
            
            document.getElementById('board-btn').style.display = 'none';
            document.getElementById('disembark-btn').style.display = 'block';
            document.getElementById('normal-controls').style.display = 'none';
            document.getElementById('jeepney-list').style.display = 'none';
            document.getElementById('alert-box').style.display = 'none';
            
            for (let plate in markers) {
                if (plate !== boardedJeepneyPlate) map.removeLayer(markers[plate]);
            }
            for (let plate in geofences) {
                if (plate !== boardedJeepneyPlate) map.removeLayer(geofences[plate]);
            }
            
            if(pingLine) { map.removeLayer(pingLine); pingLine = null; }

            map.dragging.disable();
            map.touchZoom.disable();
            map.scrollWheelZoom.disable();
            if(activeData[boardedJeepneyPlate]) {
                map.setView([activeData[boardedJeepneyPlate].lat, activeData[boardedJeepneyPlate].lon], 18);
            }
        }

        function confirmDisembark() {
            if(!isBoarded) return;
            socket.emit('passenger_disembark', { plate: boardedJeepneyPlate });
            
            isBoarded = false;
            boardedJeepneyPlate = null;
            activePingPlate = null;
            
            document.getElementById('board-btn').style.display = 'none';
            document.getElementById('disembark-btn').style.display = 'none';
            document.getElementById('normal-controls').style.display = 'block';
            document.getElementById('jeepney-list').style.display = 'block';
            
            map.dragging.enable();
            map.touchZoom.enable();
            map.scrollWheelZoom.enable();
            map.setView([6.9273, 122.0588], 14); 
            
            renderSidebar();
            for (let plate in activeData) {
                handleJeepneyUpdate(activeData[plate]); 
            }
            checkGeofence();
        }

        socket.on('initial_jeepneys', (data) => { for (let plate in data) handleJeepneyUpdate(data[plate]); });
        socket.on('initial_test_jeepneys', (data) => { for (let plate in data) handleJeepneyUpdate(data[plate]); });
        socket.on('jeepney_update', (data) => handleJeepneyUpdate(data));
        socket.on('test_jeepney_update', (data) => handleJeepneyUpdate(data));

        socket.on('test_jeepney_deleted', (plate) => {
            if (markers[plate]) map.removeLayer(markers[plate]);
            if (geofences[plate]) map.removeLayer(geofences[plate]);
            delete markers[plate]; delete geofences[plate]; delete activeData[plate];
            if(!isBoarded) renderSidebar();
        });

        socket.on('ping_acknowledged', (data) => {
            alert(`✅ Driver of jeepney ${data.plate} has seen your request!`);
        });

        function handleJeepneyUpdate(data) {
            activeData[data.plate] = data;
            
            if (isBoarded) {
                if (data.plate === boardedJeepneyPlate) {
                    if (markers[data.plate]) markers[data.plate].setLatLng([data.lat, data.lon]);
                    if (geofences[data.plate]) {
                        geofences[data.plate].setLatLng([data.lat, data.lon]);
                    }
                    map.setView([data.lat, data.lon], 18); 
                }
                return;
            }

            if (markers[data.plate]) {
                markers[data.plate].setLatLng([data.lat, data.lon]);
            } else {
                markers[data.plate] = L.marker([data.lat, data.lon], {icon: getJeepneyIcon(data.plate)}).addTo(map).bindPopup(`Plate: ${data.plate}`);
            }
            if (geofences[data.plate]) map.removeLayer(geofences[data.plate]);
            geofences[data.plate] = L.circle([data.lat, data.lon], { color: '#a3e635', fillColor: '#a3e635', fillOpacity: 0.1, radius: 100 }).addTo(map);
            
            if (data.plate === activePingPlate) {
                currentJeepPos = [data.lat, data.lon];
                if (pingLine) {
                    pingLine.setLatLngs([passengerLatLng, currentJeepPos]);
                    updateLineDistance();
                }
            }
            
            renderSidebar();
            checkGeofence();
        }

        function renderSidebar() {
            if (isBoarded) return;
            let html = '';
            for (let plate in activeData) {
                html += `
                <div class="card">
                    <strong>${plate}</strong>
                    <span>Route: ${activeData[plate].route}</span>
                    <button class="ping-btn" onclick="pingDriver('${plate}')">📢 Ping Driver</button>
                </div>`;
            }
            document.getElementById('jeepney-list').innerHTML = html || "<span style='color:#888;'>No jeepneys active nearby.</span>";
        }

        function checkGeofence() {
            if (!passengerLatLng || isBoarded) return;
            let nearby = false;
            for (let plate in activeData) {
                const dist = map.distance(passengerLatLng, [activeData[plate].lat, activeData[plate].lon]);
                if (dist <= 100) nearby = true;
            }
            document.getElementById('alert-box').style.display = nearby ? 'block' : 'none';
        }

        function toggleChat() {
            const chat = document.getElementById('chat-container');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            const typingId = 'typing-' + Date.now();
            addMessage('Typing...', 'bot', typingId);

            try {
                const res = await fetch('/api/ask-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                document.getElementById(typingId).remove();
                addMessage(data.reply || data.error, 'bot');
            } catch (err) {
                document.getElementById(typingId).remove();
                addMessage("Network error.", 'bot');
            }
        }

        function addMessage(text, sender, id = '') {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            if(id) div.id = id;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        const style = document.createElement('style');
        style.innerHTML = `
            .dist-tooltip {
                background: #1e1e1e !important;
                color: #a3e635 !important;
                border: 1px solid #333 !important;
                border-radius: 8px !important;
                font-family: 'Inter', sans-serif !important;
                font-weight: 600 !important;
                box-shadow: 0 4px 10px rgba(0,0,0,0.5) !important;
                padding: 6px 10px !important;
            }
            .dist-tooltip::before { display: none; }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
