<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARA-PO Passenger App</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--panel:rgba(30,30,30,.88);--card:#1e1e1e;--line:#333;--text:#fff;--dim:#a0a0a0;--green:#a3e635;--red:#ef4444;--amber:#fbbf24;--blue:#38bdf8}
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;margin:0;height:100vh;height:100dvh;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#map{position:absolute;inset:0;z-index:1;filter:brightness(.85) contrast(1.1)}
#sidebar{position:absolute;top:20px;left:20px;bottom:20px;width:360px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;border:1px solid var(--line);padding:24px;z-index:1000;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h2{margin:0 0 16px;font-size:22px;font-weight:600;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
#conn{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
#conn.on{background:var(--green);box-shadow:0 0 10px var(--green)}
#conn.off{background:var(--red);box-shadow:0 0 10px var(--red)}
.btn{background:#2a2a2a;color:#fff;border:1px solid #444;padding:11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;transition:.2s;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:hover:not(:disabled){background:#333;border-color:#555}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.green{color:var(--green);border-color:rgba(163,230,53,.35)}
.btn.solid{background:var(--green);color:#000;border:none;font-weight:700}
.btn.solid:hover:not(:disabled){background:#bcf258}
.btn.red{color:#fca5a5;border-color:rgba(239,68,68,.4)}
.search-form{display:flex;margin-bottom:10px}
.search-form input{flex:1;min-width:0;padding:12px 14px;border-radius:8px 0 0 8px;border:1px solid var(--line);border-right:none;background:#1a1a1a;color:#fff;outline:none}
.search-form .btn{border-radius:0 8px 8px 0;padding:0 16px}
#dest-input{border-color:rgba(56,189,248,.45)}
#dest-btn{color:var(--blue);border-color:rgba(56,189,248,.45)}
.loc-row{display:flex;gap:10px;margin-bottom:14px}
.loc-row .btn{flex:1;font-size:12px}
.btn.active{background:rgba(163,230,53,.2);border-color:var(--green);color:var(--green)}
#plan{max-height:34vh;overflow-y:auto}
.plan{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.35);border-radius:12px;padding:12px;margin-bottom:12px}
.plan .meta{line-height:1.45}
.plan .rt{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.plan .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.plan .note{font-size:11px;color:#777;margin-top:8px}
#list{flex:1;overflow-y:auto;min-height:0}
.list-head{font-size:12px;color:var(--dim);font-weight:600;margin:4px 0 8px}
.card{background:var(--card);padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line)}
.card.pinged{border-color:rgba(163,230,53,.5)}
.card.way{border-color:rgba(56,189,248,.5)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card strong{font-size:15px}
.meta{font-size:13px;color:var(--dim);margin-top:4px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.badge.open{background:rgba(163,230,53,.15);color:var(--green)}
.badge.full{background:rgba(239,68,68,.2);color:var(--red)}
.badge.way{background:rgba(56,189,248,.18);color:var(--blue)}
.badge.custom{background:rgba(251,191,36,.15);color:var(--amber)}
.card .btn{width:100%;margin-top:10px}
.card .pair{display:flex;gap:8px}
.empty{color:#888;font-size:14px;line-height:1.5}
#nearby{display:none;background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);padding:14px;border-radius:8px;font-weight:600;margin-bottom:12px;text-align:center}
#ride{display:none;flex-direction:column;gap:12px}
#ride .big{font-size:34px;font-weight:700}
#disembark{padding:18px;font-size:17px;background:var(--red);border:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.jeep-icon{display:flex;flex-direction:column;align-items:center}
.jeep-icon.dim{opacity:.4}
.jeep-name{font-weight:700;color:var(--green);background:rgba(0,0,0,.8);padding:2px 6px;border-radius:4px;font-size:11px;white-space:nowrap}
.jeep-name.full{color:var(--red)}
.jeep-emoji{font-size:30px;line-height:28px}
.road-label-wrap{background:none;border:none}
.road-label{transform:translate(-50%,-50%);display:inline-block;white-space:nowrap;color:#000;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;border:2px solid #0b0b0b;box-shadow:0 4px 12px rgba(0,0,0,.55)}
.board-pin{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);transition:opacity 6s ease-out,filter 6s ease-out}
.board-pin .tag{background:#1e1e1e;color:#a3e635;border:1px solid #a3e635;border-radius:8px;font-size:11px;font-weight:700;padding:3px 8px;white-space:nowrap}
.board-pin .pin{font-size:30px;line-height:30px;filter:drop-shadow(0 0 5px #a3e635)}
.board-pin.decay{opacity:0;filter:grayscale(1) blur(3px)}
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:20000;display:flex;flex-direction:column;gap:8px;width:min(90vw,420px);pointer-events:none}
.toast{background:#1e1e1e;border:1px solid #444;border-left:4px solid var(--green);padding:12px 14px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.err{border-left-color:var(--red)}
#chat-toggle{position:absolute;bottom:30px;right:30px;background:#1e1e1e;color:var(--green);border:1px solid #333;border-radius:50%;width:60px;height:60px;font-size:24px;cursor:pointer;z-index:3000;box-shadow:0 10px 25px rgba(0,0,0,.5)}
#chat{display:none;position:absolute;bottom:100px;right:30px;width:340px;background:var(--panel);backdrop-filter:blur(20px);border-radius:16px;border:1px solid var(--line);box-shadow:0 15px 40px rgba(0,0,0,.6);flex-direction:column;z-index:2000;overflow:hidden}
#chat-head{background:rgba(0,0,0,.3);padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
#chat-head button{background:none;border:none;color:#888;cursor:pointer;font-size:16px}
#chat-msgs{height:300px;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:85%;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:#2a2a2a;align-self:flex-start;color:#ddd;border-bottom-left-radius:4px}
.msg.user{background:rgba(163,230,53,.15);color:var(--green);border:1px solid rgba(163,230,53,.2);align-self:flex-end;border-bottom-right-radius:4px}
#chat-form{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);background:#1a1a1a}
#chat-input{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:8px;outline:none;background:#121212;color:#fff}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#444;border-radius:10px}
@media(max-width:768px){
 body{display:flex;flex-direction:column}
 #map{position:relative;inset:auto;height:48%;width:100%;flex-shrink:0}
 #sidebar{position:relative;inset:auto;flex:1;min-height:0;width:100%;border-radius:0;border:none;border-top:1px solid var(--line);padding:14px;z-index:1000}
 #plan{max-height:30vh}
 #chat{position:fixed;bottom:0;right:0;width:100%;border-radius:20px 20px 0 0;z-index:10000}
 #chat-msgs{height:45vh}
 #chat-toggle{position:fixed;bottom:16px;right:16px;width:52px;height:52px;z-index:3000}
}
@media(prefers-reduced-motion:reduce){#disembark{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<div id="sidebar">
  <h2><span id="conn" title="Connecting"></span>PARA-PO Live</h2>
  <div id="find">
    <form id="search-row" class="search-form">
      <input id="location-search" placeholder="Search where you are (Zamboanga)" autocomplete="off">
      <button class="btn" id="search-btn" aria-label="Search">🔍</button>
    </form>
    <div class="loc-row">
      <button class="btn" id="auto-btn">📍 Use my location</button>
      <button class="btn" id="manual-btn">👆 Pick on map</button>
    </div>
    <form id="dest-row" class="search-form">
      <input id="dest-input" placeholder="Where are you going?" autocomplete="off">
      <button class="btn" id="dest-btn" aria-label="Find a route">🧭</button>
    </form>
    <div id="plan" aria-live="polite"></div>
  </div>
  <div id="nearby">🚨 A jeepney is within 100 m. Look outside!</div>
  <div id="list"></div>
  <div id="ride">
    <div class="meta">You are riding</div>
    <div class="big" id="ride-plate"></div>
    <div class="meta" id="ride-info"></div>
    <button class="btn" id="disembark">🚪 I'm getting off</button>
  </div>
</div>
<div id="map"></div>

<button id="chat-toggle" aria-label="Open assistant">💬</button>
<div id="chat">
  <div id="chat-head"><span>🤖 PARA-PO assistant</span><button id="chat-close" aria-label="Close">✖</button></div>
  <div id="chat-msgs"><div class="msg bot">Mabuhay! Ask me about fares, distances, landmarks or which route goes where. To see the route and live jeepneys for a trip, set your location and type your destination in "Where are you going?".</div></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="Type a question" maxlength="500" autocomplete="off">
    <button class="btn solid" style="padding:0 16px">Send</button>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routeLabel = r => (typeof r === 'string' && r) ? r : (r ? 'Custom route' : 'Not set');
const routeId = r => (typeof r === 'string') ? r.trim().toUpperCase() : '';
const DEFAULT_VIEW = [6.9273, 122.0588];
const NEAR_M = 100, WALK_MPS = 333 / 60; // ETA uses ~20 km/h => 333 m/min
const PLAN_COLORS = ['#38bdf8', '#c084fc', '#fb923c', '#f472b6', '#facc15'];

const map = L.map('map', { zoomControl: false }).setView(DEFAULT_VIEW, 14);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

const socket = io();
const jeeps = {}, status = {}, markers = {}, rings = {};
let me = null, meMarker = null, manualMode = false;
let pinged = null, pendingPing = null, road = null;
let boarded = null, boardSpot = null, boardedAt = null, boardFromMe = false;
let plan = null, planLayers = [], planHtml = '';

function toast(msg, err) {
  const d = document.createElement('div');
  d.className = 'toast' + (err ? ' err' : '');
  d.textContent = msg;
  $('toasts').appendChild(d);
  setTimeout(() => d.remove(), 5000);
}

/* ---------- connection ---------- */
function setConn(state, text) { const c = $('conn'); c.className = state; c.title = text; }
socket.on('connect', () => setConn('on', 'Live'));
socket.on('disconnect', () => { setConn('off', 'Offline, reconnecting'); });
socket.on('connect_error', () => setConn('off', 'Offline'));
socket.io.on('reconnect', () => {
  // server dropped our seat and pings on disconnect, so reset local ride state
  if (boarded) { toast('Connection was lost. Your ride was reset.', true); leaveRide(); }
  clearPing();
});

/* ---------- jeepney data ---------- */
const goesThere = plate => !!plan && plan.routes.some(r => r.id === routeId(jeeps[plate]?.route));

// Drivers can pick any listed route or type their own. The trip planner only understands listed routes.
let catalog = null;   // Set of listed route ids, once loaded
fetch('/api/routes').then(r => r.json()).then(j => { catalog = new Set((j.routes || []).map(x => x.id)); renderList(); }).catch(() => {});
function routeKind(plate) {
  const id = routeId(jeeps[plate]?.route);
  if (!id || id === 'UNASSIGNED') return 'unset';
  if (!catalog) return 'unknown';
  return catalog.has(id) ? 'listed' : 'custom';
}

function iconFor(plate) {
  const full = status[plate]?.isFull;
  const dim = plan && !goesThere(plate);
  return L.divIcon({
    html: `<div class="jeep-icon ${dim ? 'dim' : ''}"><div class="jeep-name ${full ? 'full' : ''}">${esc(plate)}${full ? ' · FULL' : ''}</div><div class="jeep-emoji">🚐</div></div>`,
    iconSize: [90, 50], iconAnchor: [45, 40], className: ''
  });
}

function upsertJeep(d) {
  if (!d || !d.plate || !Number.isFinite(d.lat) || !Number.isFinite(d.lon)) return;
  const routeChanged = jeeps[d.plate] && routeId(jeeps[d.plate].route) !== routeId(d.route);
  jeeps[d.plate] = d;
  if (boarded && d.plate !== boarded) { renderList(); return; }
  const ll = [d.lat, d.lon];
  if (markers[d.plate]) { markers[d.plate].setLatLng(ll); if (routeChanged && plan) markers[d.plate].setIcon(iconFor(d.plate)); }
  else markers[d.plate] = L.marker(ll, { icon: iconFor(d.plate) }).addTo(map);
  if (rings[d.plate]) rings[d.plate].setLatLng(ll);
  else rings[d.plate] = L.circle(ll, { color: '#a3e635', fillColor: '#a3e635', fillOpacity: .1, weight: 1, radius: NEAR_M }).addTo(map);

  if (d.plate === pinged) updateLine();
  if (d.plate === boarded) { map.setView(ll, 18); updateRide(); }
  renderList();
  checkNearby();
}

function removeJeep(plate) {
  if (markers[plate]) map.removeLayer(markers[plate]);
  if (rings[plate]) map.removeLayer(rings[plate]);
  delete markers[plate]; delete rings[plate]; delete jeeps[plate]; delete status[plate];
  if (plate === pinged || plate === pendingPing) { clearPing(); toast(`Jeepney ${plate} went offline.`, true); }
  if (plate === boarded) { toast(`Jeepney ${plate} went offline. Your ride ended.`, true); leaveRide(); }
  renderList(); checkNearby();
}

function syncAll(data) {
  for (const p of Object.keys(jeeps)) if (!(p in data) && !p.startsWith('TEST-')) removeJeep(p);
  for (const p in data) upsertJeep(data[p]);
  renderList();
}

socket.on('initial_jeepneys', syncAll);
socket.on('initial_test_jeepneys', data => { for (const p in data) upsertJeep(data[p]); });
socket.on('jeepney_update', upsertJeep);
socket.on('test_jeepney_update', upsertJeep);
socket.on('jeepney_removed', removeJeep);
socket.on('test_jeepney_deleted', removeJeep);
socket.on('clear_all_test_objects', () => { for (const p of Object.keys(jeeps)) if (p.startsWith('TEST-')) removeJeep(p); });

socket.on('initial_status', data => {
  for (const p in data) status[p] = data[p];
  refreshAll();
});
socket.on('status_update', ({ plate, status: s }) => {
  if (!s) return;
  status[plate] = s;
  if (markers[plate]) markers[plate].setIcon(iconFor(plate));
  renderList();
  if (plate === boarded) updateRide();
});
function refreshAll() { for (const p in markers) markers[p].setIcon(iconFor(p)); renderList(); }

/* ---------- sidebar list ---------- */
function cardFor(plate) {
  const s = status[plate] || { count: 0, max: 20, isFull: false };
  const isPinged = plate === pinged, isPending = plate === pendingPing;
  const way = goesThere(plate);
  let d = me ? Math.round(dist(plate)) : null;
  let how = 'away';
  if (isPinged && road && road.len) { d = Math.round(road.len); how = 'by road'; } // same number as the map label
  let actions;
  if (isPinged) {
    actions = `<div class="pair"><button class="btn red" data-act="cancel">Cancel ping</button><button class="btn solid" data-act="board" data-plate="${esc(plate)}">✅ I boarded</button></div>`;
  } else {
    actions = `<button class="btn green" data-act="ping" data-plate="${esc(plate)}" ${(s.isFull || isPending || pinged) ? 'disabled' : ''}>${isPending ? 'Pinging…' : s.isFull ? 'Jeepney is full' : '📢 Ping driver'}</button>
               ${!pinged ? `<button class="btn" data-act="board" data-plate="${esc(plate)}" ${s.isFull ? 'disabled' : ''}>I'm already on this jeepney</button>` : ''}`;
  }
  return `<div class="card ${isPinged ? 'pinged' : ''} ${way ? 'way' : ''}">
    <div class="card-top"><strong>${esc(plate)}</strong><span class="badge ${s.isFull ? 'full' : 'open'}">${s.isFull ? 'Full' : `${s.count}/${s.max} seats taken`}</span></div>
    <div class="meta">Route: ${esc(routeLabel(jeeps[plate].route))}${d !== null ? ` · ${d >= 1000 ? (d / 1000).toFixed(1) + ' km' : d + ' m'} ${how}` : ''}</div>
    ${way ? '<div style="margin-top:6px"><span class="badge way">🧭 Goes your way</span></div>' : ''}
    ${!way && routeKind(plate) === 'custom' ? '<div style="margin-top:6px"><span class="badge custom" title="The driver typed their own route, so we cannot tell if it goes your way">Driver\'s own route · not in route list</span></div>' : ''}
    ${!way && routeKind(plate) === 'unset' ? '<div style="margin-top:6px"><span class="badge custom">Route not set by driver</span></div>' : ''}
    ${isPinged ? '<div class="meta" style="color:var(--green)">Ping sent. Wait by the road and wave.</div>' : ''}
    ${actions}</div>`;
}
function renderList() {
  if (boarded) return;
  renderPlan();
  const plates = Object.keys(jeeps).sort((a, b) => (goesThere(b) - goesThere(a)) || (dist(a) - dist(b)));
  if (!plates.length) { $('list').innerHTML = '<div class="empty">No jeepneys are online right now. This list updates by itself when one appears.</div>'; return; }
  const anyWay = plan && plates.some(goesThere);
  let html = '', shownOthers = false;
  if (anyWay) html += '<div class="list-head">Jeepneys on your route</div>';
  else if (plan) html += '<div class="list-head">No jeepney on your route is online right now. All jeepneys:</div>';
  for (const plate of plates) {
    if (anyWay && !goesThere(plate) && !shownOthers) { html += '<div class="list-head">Other jeepneys</div>'; shownOthers = true; }
    html += cardFor(plate);
  }
  $('list').innerHTML = html;
}
function dist(plate) {
  const j = jeeps[plate];
  return me && j ? map.distance(me, [j.lat, j.lon]) : 0;
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  const { act, plate } = b.dataset;
  if (act === 'ping') pingDriver(plate);
  else if (act === 'cancel') cancelPing();
  else if (act === 'board') boardJeep(plate);
});

function checkNearby() {
  let near = false;
  if (me && !boarded) for (const p in jeeps) if (map.distance(me, [jeeps[p].lat, jeeps[p].lon]) <= NEAR_M) near = true;
  $('nearby').style.display = near ? 'block' : 'none';
}

/* ---------- my location ---------- */
function personIcon() {
  return L.divIcon({ html: '<div style="font-size:30px;filter:drop-shadow(0 0 5px #a3e635)">🧍</div>', iconSize: [30, 30], className: '' });
}
function boardIcon(t) {
  const hm = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="board-pin"><div class="tag">Boarded here · ${hm}</div><div class="pin">📍</div></div>` });
}
function decayMarker(m) { // fade the boarding pin out after the ride, then remove it
  const el = m.getElement() && m.getElement().querySelector('.board-pin');
  if (el) el.classList.add('decay');
  m.closePopup(); m.unbindPopup();
  setTimeout(() => map.removeLayer(m), 6500);
}
function setMe(lat, lon, fly) {
  me = [lat, lon];
  const icon = personIcon();
  if (meMarker) meMarker.setLatLng(me); else meMarker = L.marker(me, { icon }).addTo(map).bindPopup('You are here');
  if (fly) map.setView(me, 16);
  renderList(); checkNearby();
}
$('auto-btn').onclick = () => {
  if (!navigator.geolocation) return toast('This browser has no location support. Pick a spot on the map instead.', true);
  navigator.geolocation.getCurrentPosition(
    p => setMe(p.coords.latitude, p.coords.longitude, true),
    () => toast('Could not get your location. Allow location access or pick a spot on the map.', true),
    { enableHighAccuracy: true, timeout: 10000 });
};
$('manual-btn').onclick = () => { manualMode = !manualMode; $('manual-btn').classList.toggle('active', manualMode); if (manualMode) toast('Tap the map where you are waiting.'); };
map.on('click', e => {
  if (!manualMode) return;
  setMe(e.latlng.lat, e.latlng.lng);
  manualMode = false; $('manual-btn').classList.remove('active');
});
$('search-row').onsubmit = async e => {
  e.preventDefault();
  const q = $('location-search').value.trim();
  if (!q || boarded) return;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q + ', Zamboanga City')}`);
    const data = await r.json();
    if (!data.length) return toast('No match for that place. Try a landmark or barangay name.', true);
    setMe(parseFloat(data[0].lat), parseFloat(data[0].lon), true);
  } catch { toast('Search failed. Check your connection and try again.', true); }
};

/* ---------- road-following line with distance/time label ---------- */
function hav(a, b) {
  const R = 6371e3, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function pathLen(pts) { let t = 0; for (let i = 1; i < pts.length; i++) t += hav(pts[i - 1], pts[i]); return t; }
function pointAt(pts, target) {
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const seg = hav(pts[i - 1], pts[i]);
    if (seg > 0 && acc + seg >= target) {
      const f = (target - acc) / seg;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
    }
    acc += seg;
  }
  return pts[pts.length - 1];
}
const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';

// The road geometry is fetched at most every few seconds, so by the time it is drawn the jeepney has moved on.
// Snap the jeepney onto the road and keep only the part of the road AHEAD of it. Without this the line
// doubled back to where the jeepney was when the road was fetched, and the distance went up as it approached.
function trimFrom(coords, p) {
  if (coords.length < 2) return coords;
  const mx = 111320 * Math.cos(p[0] * Math.PI / 180), my = 110540;
  let best = Infinity, bi = 1, bp = coords[0];
  for (let i = 1; i < coords.length; i++) {
    const a = coords[i - 1], b = coords[i];
    const ax = (a[1] - p[1]) * mx, ay = (a[0] - p[0]) * my;
    const dx = (b[1] - p[1]) * mx - ax, dy = (b[0] - p[0]) * my - ay;
    const l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < best) { best = d; bi = i; bp = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  }
  return [bp, ...coords.slice(bi)];
}

// Draws jeepney -> passenger along the road (OSRM). Shows a dashed straight line until the road arrives
// or if routing fails. The label stays live between route refreshes.
class RoadLine {
  constructor(map, color, tag) {
    this.map = map; this.color = color; this.tag = tag || '';
    const base = { lineCap: 'round', lineJoin: 'round', interactive: false };
    this.casing = L.polyline([], { ...base, color: '#0b0b0b', weight: 13, opacity: .9 });
    this.line = L.polyline([], { ...base, color, weight: 7, opacity: 1 });
    this.label = L.marker([0, 0], { interactive: false, keyboard: false, zIndexOffset: 1000, icon: L.divIcon({ className: 'road-label-wrap', html: '', iconSize: [0, 0] }) });
    this.road = null; this.shown = false; this.pending = false; this.fetchedAt = 0; this.fa = null; this.fb = null; this.token = 0; this.len = 0;
  }
  update(a, b) {            // a: jeepney [lat, lon], b: passenger [lat, lon]
    this.a = a; this.b = b;
    if (!this.shown) { this.casing.addTo(this.map); this.line.addTo(this.map); this.label.addTo(this.map); this.shown = true; }
    const moved = !this.fa || hav(a, this.fa) > 15 || hav(b, this.fb) > 15;
    if (!this.pending && Date.now() - this.fetchedAt > 4000 && (moved || !this.road)) this.fetchRoad();
    this.draw();
  }
  async fetchRoad() {
    const tok = this.token, a = this.a, b = this.b;
    this.pending = true; this.fetchedAt = Date.now(); this.fa = a; this.fb = b;
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
      const j = await r.json();
      if (tok === this.token && j.routes && j.routes[0]) {
        const rt = j.routes[0];
        this.road = { coords: rt.geometry.coordinates.map(c => [c[1], c[0]]), distance: rt.distance, duration: rt.duration };
        this.draw();
      }
    } catch (e) { console.error('Routing error', e); }
    if (tok === this.token) this.pending = false;
  }
  draw() {
    if (!this.shown) return;
    const hasRoad = !!this.road;
    const pts = hasRoad ? [this.a, ...trimFrom(this.road.coords, this.a), this.b] : [this.a, this.b];
    const len = pathLen(pts);
    this.len = len;
    const secs = hasRoad ? len * (this.road.duration / Math.max(this.road.distance, 1)) : len / 5.55; // fallback ~20 km/h
    this.casing.setLatLngs(pts);
    this.line.setLatLngs(pts);
    this.line.setStyle({ dashArray: hasRoad ? null : '12,12' });
    const mins = Math.max(1, Math.ceil(secs / 60));
    const text = `${esc(this.tag)}${hasRoad ? '' : '~'}${mins} min · ${fmtDist(len)}${hasRoad ? '' : ' (straight line)'}`;
    this.label.setLatLng(pointAt(pts, len / 2)).setIcon(L.divIcon({ className: 'road-label-wrap', iconSize: [0, 0], html: `<div class="road-label" style="background:${this.color}">${text}</div>` }));
  }
  clear() {
    this.token++; this.pending = false; this.road = null; this.fetchedAt = 0; this.fa = this.fb = null; this.len = 0;
    if (this.shown) { this.map.removeLayer(this.casing); this.map.removeLayer(this.line); this.map.removeLayer(this.label); }
    this.shown = false;
  }
}

/* ---------- ping ---------- */
function pingDriver(plate) {
  if (!me) return toast('Set your location first: use GPS or pick a spot on the map.', true);
  pendingPing = plate;
  socket.emit('passenger_ping', { plate, passLat: me[0], passLon: me[1] });
  renderList();
}
socket.on('ping_sent', r => {
  const plate = pendingPing; pendingPing = null;
  if (r.error) { toast(r.error, true); renderList(); return; }
  pinged = r.plate || plate;
  toast(r.driverOnline ? `Driver of ${pinged} was alerted (${Math.round(r.distance)} m away).` : `Ping saved, but the driver of ${pinged} is not connected yet.`, !r.driverOnline);
  updateLine(); renderList();
});
function cancelPing() {
  if (pinged) socket.emit('passenger_cancel_ping', { plate: pinged });
  clearPing();
}
function clearPing() {
  pinged = null; pendingPing = null;
  if (road) { road.clear(); road = null; }
  renderList();
}
function updateLine() {
  const j = jeeps[pinged];
  if (!me || !j) return;
  if (!road) road = new RoadLine(map, '#a3e635');
  road.update([j.lat, j.lon], me);
}
socket.on('ping_acknowledged', ({ plate }) => toast(`✅ Driver of ${plate} saw your request.`));
socket.on('ping_expired', ({ plate, reason }) => {
  if (plate !== pinged) return;
  toast(reason === 'offline' ? `Jeepney ${plate} went offline.` : `Your ping to ${plate} expired. Ping again if you are still waiting.`, true);
  clearPing();
});

/* ---------- destination planner ---------- */
function removePlanLayers() { for (const l of planLayers) map.removeLayer(l); planLayers = []; }
function clearPlan() {
  removePlanLayers();
  plan = null;
  refreshAll();
}
function renderPlan() {
  let html = '';
  if (plan) {
    const online = id => Object.keys(jeeps).filter(p => routeId(jeeps[p].route) === id).length;
    html = `<div class="plan"><div class="card-top"><strong>🏁 ${esc(plan.name)}</strong><button class="btn red" data-plan="clear" style="padding:4px 10px">Clear</button></div>`;
    if (plan.routes.length) {
      html += plan.routes.map((r, i) => {
        const n = online(r.id);
        return `<div class="rt"><div class="meta"><span class="dot" style="background:${PLAN_COLORS[i % PLAN_COLORS.length]}"></span><b style="color:#fff">${esc(r.id)}</b> · ${fmtDist(r.rideM)} ride toward ${esc(r.towards)}</div>
          <div class="meta">Walk ${fmtDist(r.walkToBoardM)} to the route, and ${fmtDist(r.walkFromAlightM)} from where you get off.</div>
          <div class="meta" style="color:${n ? 'var(--blue)' : '#888'}">${n ? `${n} jeepney${n > 1 ? 's' : ''} online on this route` : 'No jeepney online on this route right now'}</div></div>`;
      }).join('');
    } else {
      html += '<div class="meta">No single route in our list connects your spot to this place.</div>';
      if (plan.servesDestination && plan.servesDestination.length) html += `<div class="meta">Routes that pass near it: ${plan.servesDestination.map(r => esc(r.id)).join(', ')}. You may need to transfer.</div>`;
      if (plan.servesOrigin && plan.servesOrigin.length) html += `<div class="meta">Routes near you: ${plan.servesOrigin.map(r => esc(r.id)).join(', ')}.</div>`;
    }
    const unknown = Object.keys(jeeps).filter(p => ['custom', 'unset'].includes(routeKind(p))).length;
    if (unknown) html += `<div class="meta" style="color:var(--amber)">${unknown} online jeepney${unknown > 1 ? 's use' : ' uses'} their own or no route, so we can't tell if ${unknown > 1 ? 'they go' : 'it goes'} your way. Check the route shown on the card.</div>`;
    html += '<div class="note">Routes are a guide from the city route list. Confirm with the driver before you ride.</div></div>';
  }
  if (html !== planHtml) { planHtml = html; $('plan').innerHTML = html; }
}
$('plan').addEventListener('click', e => { if (e.target.closest('[data-plan="clear"]')) clearPlan(); });

async function drawPlan() {
  const mine = plan;
  planLayers.push(L.marker(mine.dest, { icon: L.divIcon({ html: '<div style="font-size:30px;filter:drop-shadow(0 0 5px #38bdf8)">🏁</div>', iconSize: [30, 30], iconAnchor: [6, 28], className: '' }) }).addTo(map).bindPopup(esc(mine.name)));
  if (me) map.fitBounds(L.latLngBounds([me, mine.dest]).pad(0.3));
  for (const [i, rt] of mine.routes.slice(0, 3).entries()) {
    let pts = rt.path, dashed = true;
    try {
      const coords = rt.path.map(p => `${p[1]},${p[0]}`).join(';');
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
      const j = await r.json();
      if (j.routes && j.routes[0]) { pts = j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]); dashed = false; }
    } catch (e) { console.error('Routing error', e); }
    if (plan !== mine) return; // cleared or replaced while loading
    planLayers.push(L.polyline(pts, { color: PLAN_COLORS[i % PLAN_COLORS.length], weight: 5, opacity: .85, dashArray: dashed ? '10,10' : null, lineCap: 'round', interactive: false }).addTo(map));
  }
}

$('dest-row').onsubmit = async e => {
  e.preventDefault();
  const q = $('dest-input').value.trim();
  if (!q || boarded) return;
  if (!me) return toast('Set your location first (use GPS, pick on the map, or search where you are).', true);
  const btn = $('dest-btn'); btn.disabled = true;
  try {
    const g = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ph&bounded=1&viewbox=121.85,7.25,122.35,6.85&q=' + encodeURIComponent(q + ', Zamboanga City'));
    const data = await g.json();
    if (!data.length) return toast('Could not find that place. Try a landmark, school, mall or barangay name.', true);
    const to = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
    const r = await fetch('/api/plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fromLat: me[0], fromLon: me[1], toLat: to[0], toLon: to[1] }) });
    const j = await r.json();
    if (!r.ok) return toast(j.error || 'Could not find a route right now.', true);
    removePlanLayers();
    plan = { name: String(data[0].display_name || q).split(',')[0] || q, dest: to, routes: j.routes || [], servesDestination: j.servesDestination || [], servesOrigin: j.servesOrigin || [] };
    drawPlan();
    refreshAll();
  } catch { toast('Trip search failed. Check your connection and try again.', true); }
  finally { btn.disabled = false; }
};

/* ---------- riding ---------- */
function boardJeep(plate) {
  if (!jeeps[plate]) return;
  if (pinged) socket.emit('passenger_cancel_ping', { plate: pinged });
  socket.emit('passenger_board', { plate });
  enterRide(plate);
}
socket.on('board_rejected', ({ plate }) => {
  if (plate === boarded) { leaveRide(true); toast(`Jeepney ${plate} is full.`, true); }
});
function enterRide(plate) {
  boarded = plate; boardedAt = new Date(); clearPing();
  removePlanLayers(); plan = null; planHtml = ''; $('plan').innerHTML = '';
  const jp = jeeps[plate];
  boardFromMe = !!me;
  boardSpot = me ? [...me] : (jp ? [jp.lat, jp.lon] : null);   // where you got on
  if (boardSpot) {
    if (!meMarker) meMarker = L.marker(boardSpot).addTo(map);
    meMarker.setLatLng(boardSpot).setIcon(boardIcon(boardedAt)).unbindPopup().bindPopup('You boarded here');
  }
  $('find').style.display = 'none'; $('list').style.display = 'none'; $('nearby').style.display = 'none';
  $('ride').style.display = 'flex';
  for (const p in markers) if (p !== plate) { map.removeLayer(markers[p]); map.removeLayer(rings[p]); delete markers[p]; delete rings[p]; }
  map.dragging.disable(); map.touchZoom.disable(); map.scrollWheelZoom.disable();
  const j = jeeps[plate]; if (j) map.setView([j.lat, j.lon], 18);
  updateRide();
}
function updateRide() {
  const s = status[boarded] || { count: 0, max: 20 };
  const j = jeeps[boarded];
  $('ride-plate').textContent = boarded;
  $('ride-info').textContent = `Route: ${routeLabel(j?.route)} · ${s.count}/${s.max} seats taken`
    + (boardedAt ? ` · Boarded ${boardedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : '')
    + (boardSpot && j ? ` · ${fmtDist(hav(boardSpot, [j.lat, j.lon]))} from where you got on` : '');
}
function leaveRide(neverRode) {
  const j = jeeps[boarded];
  boarded = null; boardSpot = null; boardedAt = null;
  if (meMarker) {
    if (neverRode && boardFromMe) meMarker.setIcon(personIcon()).unbindPopup().bindPopup('You are here');   // ride rejected: you are still waiting here
    else if (neverRode) { map.removeLayer(meMarker); meMarker = null; }
    else { decayMarker(meMarker); meMarker = null; me = null; }                                        // ride over: pin fades, location is stale
  }
  $('ride').style.display = 'none'; $('find').style.display = 'block'; $('list').style.display = 'block';
  map.dragging.enable(); map.touchZoom.enable(); map.scrollWheelZoom.enable();
  map.setView(me || (j ? [j.lat, j.lon] : DEFAULT_VIEW), (me || j) ? 16 : 14);
  for (const p in jeeps) upsertJeep(jeeps[p]);
  renderList(); checkNearby();
}
$('disembark').onclick = () => {
  if (boarded) socket.emit('passenger_disembark', { plate: boarded });
  leaveRide();
  toast('Thanks for riding. Set your location to find your next jeepney.');
};

/* ---------- assistant ---------- */
const history = [];
const chat = $('chat');
$('chat-toggle').onclick = () => { chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex'; if (chat.style.display === 'flex') $('chat-input').focus(); };
$('chat-close').onclick = () => chat.style.display = 'none';
function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who; d.textContent = text;
  $('chat-msgs').appendChild(d); $('chat-msgs').scrollTop = 1e9;
  return d;
}
let asking = false;
$('chat-form').onsubmit = async e => {
  e.preventDefault();
  const text = $('chat-input').value.trim();
  if (!text || asking) return;
  asking = true; $('chat-input').value = '';
  addMsg(text, 'user');
  const typing = addMsg('Typing…', 'bot');
  try {
    const r = await fetch('/api/ask-ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, history: history.slice(-6) }) });
    const data = await r.json();
    const reply = data.reply || data.error || 'Something went wrong.';
    typing.textContent = reply;
    if (data.reply) history.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
  } catch { typing.textContent = 'Network error. Please try again.'; }
  asking = false;
};

renderList();
</script>
</body>
</html>
