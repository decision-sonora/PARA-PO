<!DOCTYPE html>
<html>
<head>
    <title>PARA-PO Passenger App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lora', serif; margin: 0; display: flex; height: 100vh; background: radial-gradient(circle at 50% 50%, #1a0500 0%, #050000 100%); color: #e6d5c3; background-image: radial-gradient(circle at 50% 50%, rgba(255, 80, 0, 0.1) 0%, transparent 60%), radial-gradient(#ffffff 1px, transparent 1px); background-size: 100% 100%, 30px 30px; }
        #sidebar { width: 360px; padding: 25px; background: rgba(20, 5, 0, 0.75); backdrop-filter: blur(12px); z-index: 1000; display: flex; flex-direction: column; border-right: 1px solid rgba(255, 100, 50, 0.2); box-shadow: 10px 0 30px rgba(0,0,0,0.5); transition: 0.3s; }
        #map { flex-grow: 1; }
        h2 { font-family: 'Playfair Display', serif; color: #ff6b35; margin-top: 0; font-size: 28px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
        
        .card { background: rgba(40, 10, 5, 0.7); padding: 18px; margin-bottom: 12px; border-radius: 12px; border-left: 4px solid #ff6b35; box-shadow: 0 8px 32px rgba(255, 60, 0, 0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; backdrop-filter: blur(5px); }
        .card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255, 60, 0, 0.25); }
        
        .ping-btn { background: linear-gradient(135deg, #ff4d00, #cc3300); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 12px; font-weight: bold; font-family: 'Lora', serif; box-shadow: 0 4px 15px rgba(255, 60, 0, 0.3); transition: 0.2s;}
        .ping-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 60, 0, 0.5); }
        
        #board-btn { display: none; background: linear-gradient(135deg, #ffaa00, #ff6600); color: #1a0500; border: none; padding: 18px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 18px; margin-top: 15px; animation: pulse 1.5s infinite; box-shadow: 0 4px 15px rgba(255, 150, 0, 0.4); font-family: 'Lora', serif;}
        #disembark-btn { display: none; background: linear-gradient(135deg, #a60000, #ff0040); color: white; border: none; padding: 22px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 20px; margin-top: 15px; animation: pulse 1.5s infinite; box-shadow: 0 4px 15px rgba(200, 0, 0, 0.4); font-family: 'Lora', serif;}
        
        #alert-box { display: none; background: rgba(255, 80, 0, 0.2); color: #ffb399; border: 1px solid #ff6b35; padding: 18px; border-radius: 10px; font-weight: bold; margin-bottom: 15px; text-align: center; animation: pulse 2s infinite; }
        
        .loc-btn { background: rgba(255, 255, 255, 0.1); color: #e6d5c3; border: 1px solid rgba(255, 100, 50, 0.4); padding: 12px; border-radius: 8px; cursor: pointer; flex: 1; margin: 0 5px; font-size: 13px; font-family: 'Lora', serif; transition: 0.2s;}
        .loc-btn:hover { background: rgba(255, 100, 50, 0.3); color: white; }
        #search-container { display: flex; margin-bottom: 12px; }
        #location-search { flex-grow: 1; padding: 12px; border-radius: 8px 0 0 8px; border: 1px solid rgba(255,100,50,0.3); outline: none; background: rgba(0,0,0,0.5); color: white; font-family: 'Lora', serif;}
        #search-btn { background: #ff6b35; color: white; border: none; padding: 10px 18px; border-radius: 0 8px 8px 0; cursor: pointer; font-weight: bold; transition: 0.2s;}
        #search-btn:hover { background: #ff4d00; }
        .loc-controls { display: flex; margin-bottom: 15px; }
        
        #chat-toggle { position: absolute; bottom: 30px; right: 30px; background: linear-gradient(135deg, #ff4d00, #cc3300); color: white; border: none; border-radius: 50%; width: 65px; height: 65px; font-size: 30px; cursor: pointer; z-index: 3000; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 25px rgba(255, 60, 0, 0.5); transition: 0.3s;}
        #chat-toggle:hover { transform: scale(1.1); }
        
        #chat-container { display: none; position: absolute; bottom: 105px; right: 30px; width: 340px; background: rgba(20, 5, 0, 0.9); backdrop-filter: blur(15px); border-radius: 15px; border: 1px solid rgba(255,100,50,0.3); box-shadow: 0 15px 40px rgba(0,0,0,0.8); flex-direction: column; z-index: 2000; overflow: hidden; }
        #chat-header { background: rgba(255, 80, 0, 0.15); color: #ff6b35; padding: 18px; font-weight: bold; display: flex; justify-content: space-between; font-family: 'Playfair Display', serif; border-bottom: 1px solid rgba(255,100,50,0.2);}
        #chat-messages { height: 300px; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .msg.bot { background: rgba(255, 255, 255, 0.1); align-self: flex-start; color: #e6d5c3; border: 1px solid rgba(255,255,255,0.1); }
        .msg.user { background: rgba(255, 80, 0, 0.2); border: 1px solid rgba(255,100,50,0.3); align-self: flex-end; color: #ffb399; }
        #chat-input-area { display: flex; padding: 15px; border-top: 1px solid rgba(255,100,50,0.2); background: rgba(0,0,0,0.3); }
        #chat-input { flex-grow: 1; padding: 12px; border: 1px solid rgba(255,100,50,0.3); border-radius: 20px; outline: none; background: rgba(0,0,0,0.4); color: white; font-family: 'Lora', serif;}
        #send-btn { background: #ff6b35; color: white; border: none; padding: 10px 18px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; font-family: 'Lora', serif;}
        
        .custom-jeep-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .jeep-name { font-weight: bold; color: #ffb399; text-shadow: 1px 1px 2px black, -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black; font-size: 13px; white-space: nowrap; font-family: 'Playfair Display', serif;}
        .jeep-emoji { font-size: 32px; line-height: 25px; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        
        /* Scroll animations */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,100,50,0.4); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>PARA-PO Live</h2>
        
        <div id="normal-controls">
            <div id="search-container">
                <input type="text" id="location-search" placeholder="Search location..." onkeypress="handleSearchEnter(event)">
                <button id="search-btn" onclick="searchLocation()">🔍</button>
            </div>
            
            <div class="loc-controls">
                <button class="loc-btn" onclick="autoLocate()">📍 Auto Locate</button>
                <button class="loc-btn" id="manual-btn" onclick="enableManualLocate()">👆 Click Map</button>
            </div>
        </div>

        <div id="alert-box">🚨 Jeepney is nearby! Look outside!</div>
        <div id="jeepney-list" style="flex-grow:1; overflow-y: auto;">Searching...</div>
        
        <button id="board-btn" onclick="confirmBoard()">✅ I Have Boarded</button>
        <button id="disembark-btn" onclick="confirmDisembark()">🚪 Board Off / Disembark</button>
    </div>
    <div id="map"></div>

    <button id="chat-toggle" onclick="toggleChat()">💬</button>

    <div id="chat-container">
        <div id="chat-header">
            <span>🤖 PARA-PO AI</span>
            <span style="cursor:pointer;" onclick="toggleChat()">✖</span>
        </div>
        <div id="chat-messages">
            <div class="msg bot">Mabuhay! Hello! Ask me about fares, routes, or where the jeepneys are!</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([6.9273, 122.0588], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        const markers = {};
        const geofences = {};
        let activeData = {}; 
        let passengerLatLng = null;
        let myMarker = null; 
        let manualMode = false;
        
        let isBoarded = false;
        let boardedJeepneyPlate = null;
        let activePingPlate = null; 
        let pingLine = null;        
        let currentJeepPos = null;  

        const socket = io();

        function getJeepneyIcon(plate) {
            return L.divIcon({
                html: `<div class="custom-jeep-icon"><div class="jeep-name">${plate}</div><div class="jeep-emoji">🚐</div></div>`,
                iconSize: [80, 50],
                className: ''
            });
        }

        function setMyLocation(lat, lon) {
            passengerLatLng = [lat, lon];
            const icon = L.divIcon({ html: '🧍', iconSize: [30, 30], className: '' });
            if (myMarker) map.removeLayer(myMarker);
            myMarker = L.marker([lat, lon], {icon: icon}).addTo(map).bindPopup("You are here");
            
            socket.emit('passenger_location_update', { lat: lat, lon: lon });
            checkGeofence();
        }

        function autoLocate() {
            if (!navigator.geolocation) return alert("Geolocation not supported.");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    setMyLocation(pos.coords.latitude, pos.coords.longitude);
                    map.setView([pos.coords.latitude, pos.coords.longitude], 16);
                },
                (err) => alert("Could not get location. Please use click map.")
            );
        }

        function enableManualLocate() {
            manualMode = true;
            document.getElementById('manual-btn').style.background = "rgba(255, 100, 50, 0.5)";
            document.getElementById('manual-btn').style.color = "white";
        }

        map.on('click', (e) => {
            if (manualMode) {
                setMyLocation(e.latlng.lat, e.latlng.lng);
                manualMode = false;
                document.getElementById('manual-btn').style.background = "";
                document.getElementById('manual-btn').style.color = "";
            }
        });

        function handleSearchEnter(e) { if (e.key === 'Enter') searchLocation(); }

        async function searchLocation() {
            if (isBoarded) return;
            const query = document.getElementById('location-search').value;
            if (!query) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Zamboanga City')}`);
                const data = await res.json();
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    setMyLocation(lat, lon);
                    map.setView([lat, lon], 16);
                } else {
                    alert("Location not found.");
                }
            } catch (err) { alert("Error searching."); }
        }

        function pingDriver(plate) {
            if(isBoarded) return;
            if(!passengerLatLng) return alert("Please set your location first.");
            
            activePingPlate = plate;
            currentJeepPos = [activeData[plate].lat, activeData[plate].lon];
            
            socket.emit('passenger_ping', { plate: plate, passLat: passengerLatLng[0], passLon: passengerLatLng[1] });
            
            if (pingLine) map.removeLayer(pingLine);
            pingLine = L.polyline([passengerLatLng, currentJeepPos], {color: '#ff6b35', weight: 4, dashArray: '10, 10'}).addTo(map);
            updateLineDistance();

            document.getElementById('board-btn').style.display = 'block';
        }

        function updateLineDistance() {
            if(!pingLine || !passengerLatLng || !currentJeepPos) return;
            const dist = map.distance(passengerLatLng, currentJeepPos);
            pingLine.bindTooltip(`${Math.round(dist)} meters away`, {permanent: true, direction: "center", className: "dist-tooltip"}).openTooltip();
        }

        function confirmBoard() {
            if(!activePingPlate) return;
            socket.emit('passenger_board', { plate: activePingPlate });
            
            isBoarded = true;
            boardedJeepneyPlate = activePingPlate;
            
            document.getElementById('board-btn').style.display = 'none';
            document.getElementById('disembark-btn').style.display = 'block';
            document.getElementById('normal-controls').style.display = 'none';
            document.getElementById('jeepney-list').style.display = 'none';
            document.getElementById('alert-box').style.display = 'none';
            
            for (let plate in markers) {
                if (plate !== boardedJeepneyPlate) map.removeLayer(markers[plate]);
            }
            for (let plate in geofences) {
                if (plate !== boardedJeepneyPlate) map.removeLayer(geofences[plate]);
            }
            
            if(pingLine) { map.removeLayer(pingLine); pingLine = null; }

            map.dragging.disable();
            map.touchZoom.disable();
            map.scrollWheelZoom.disable();
            if(activeData[boardedJeepneyPlate]) {
                map.setView([activeData[boardedJeepneyPlate].lat, activeData[boardedJeepneyPlate].lon], 18);
            }
        }

        function confirmDisembark() {
            if(!isBoarded) return;
            socket.emit('passenger_disembark', { plate: boardedJeepneyPlate });
            
            isBoarded = false;
            boardedJeepneyPlate = null;
            activePingPlate = null;
            
            document.getElementById('board-btn').style.display = 'none';
            document.getElementById('disembark-btn').style.display = 'none';
            document.getElementById('normal-controls').style.display = 'block';
            document.getElementById('jeepney-list').style.display = 'block';
            
            map.dragging.enable();
            map.touchZoom.enable();
            map.scrollWheelZoom.enable();
            map.setView([6.9273, 122.0588], 14); 
            
            renderSidebar();
            for (let plate in activeData) {
                handleJeepneyUpdate(activeData[plate]); 
            }
            checkGeofence();
        }

        socket.on('initial_jeepneys', (data) => { for (let plate in data) handleJeepneyUpdate(data[plate]); });
        socket.on('initial_test_jeepneys', (data) => { for (let plate in data) handleJeepneyUpdate(data[plate]); });
        socket.on('jeepney_update', (data) => handleJeepneyUpdate(data));
        socket.on('test_jeepney_update', (data) => handleJeepneyUpdate(data));

        socket.on('test_jeepney_deleted', (plate) => {
            if (markers[plate]) map.removeLayer(markers[plate]);
            if (geofences[plate]) map.removeLayer(geofences[plate]);
            delete markers[plate]; delete geofences[plate]; delete activeData[plate];
            if(!isBoarded) renderSidebar();
        });

        socket.on('ping_acknowledged', (data) => {
            alert(`✅ Driver of jeepney ${data.plate} has seen your request!`);
        });

        function handleJeepneyUpdate(data) {
            activeData[data.plate] = data;
            
            if (isBoarded) {
                if (data.plate === boardedJeepneyPlate) {
                    if (markers[data.plate]) markers[data.plate].setLatLng([data.lat, data.lon]);
                    // FIX: Geofence follows the jeepney in riding mode
                    if (geofences[data.plate]) {
                        geofences[data.plate].setLatLng([data.lat, data.lon]);
                    }
                    map.setView([data.lat, data.lon], 18); 
                }
                return;
            }

            if (markers[data.plate]) {
                markers[data.plate].setLatLng([data.lat, data.lon]);
            } else {
                markers[data.plate] = L.marker([data.lat, data.lon], {icon: getJeepneyIcon(data.plate)}).addTo(map).bindPopup(`Plate: ${data.plate}`);
            }
            if (geofences[data.plate]) map.removeLayer(geofences[data.plate]);
            geofences[data.plate] = L.circle([data.lat, data.lon], { color: '#ff6b35', fillColor: '#ff6b35', fillOpacity: 0.15, radius: 100 }).addTo(map);
            
            if (data.plate === activePingPlate) {
                currentJeepPos = [data.lat, data.lon];
                if (pingLine) {
                    pingLine.setLatLngs([passengerLatLng, currentJeepPos]);
                    updateLineDistance();
                }
            }
            
            renderSidebar();
            checkGeofence();
        }

        function renderSidebar() {
            if (isBoarded) return;
            let html = '';
            for (let plate in activeData) {
                html += `
                <div class="card">
                    <strong>Plate: ${plate}</strong><br>
                    Route: ${activeData[plate].route}<br>
                    <button class="ping-btn" onclick="pingDriver('${plate}')">📢 Ping Driver</button>
                </div>`;
            }
            document.getElementById('jeepney-list').innerHTML = html || "No jeepneys active.";
        }

        function checkGeofence() {
            if (!passengerLatLng || isBoarded) return;
            let nearby = false;
            for (let plate in activeData) {
                const dist = map.distance(passengerLatLng, [activeData[plate].lat, activeData[plate].lon]);
                if (dist <= 100) nearby = true;
            }
            document.getElementById('alert-box').style.display = nearby ? 'block' : 'none';
        }

        function toggleChat() {
            const chat = document.getElementById('chat-container');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            const typingId = 'typing-' + Date.now();
            addMessage('Typing...', 'bot', typingId);

            try {
                const res = await fetch('/api/ask-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                document.getElementById(typingId).remove();
                addMessage(data.reply || data.error, 'bot');
            } catch (err) {
                document.getElementById(typingId).remove();
                addMessage("Network error.", 'bot');
            }
        }

        function addMessage(text, sender, id = '') {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            if(id) div.id = id;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
