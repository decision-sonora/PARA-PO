<!DOCTYPE html>
<html>
<head>
    <title>PARA-PO Driver Dashboard</title>
    <style>
        body { font-family: Arial; background: #1e1e2f; color: white; text-align: center; padding: 50px 20px; }
        h1 { font-size: 32px; color: #00f2c3; }
        #alert-box { display: none; background: #fd5d93; padding: 30px; border-radius: 15px; margin-top: 30px; animation: flash 1s infinite; }
        .ack-btn { background: #00f2c3; color: #1e1e2f; border: none; padding: 20px 40px; font-size: 24px; border-radius: 10px; margin-top: 20px; cursor: pointer; font-weight: bold; width: 100%; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h1>🚐 PARA-PO Driver</h1>
    <p>Keep this screen open while driving. Voice alerts are enabled.</p>
    
    <div id="alert-box">
        <h2>🔔 PASSENGER WAITING!</h2>
        <p id="alert-msg"></p>
        <button class="ack-btn" onclick="acknowledge()">✅ I SEE THEM</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentPingPlate = null;

        socket.on('driver_alert', (data) => {
            currentPingPlate = data.plate;
            document.getElementById('alert-box').style.display = 'block';
            document.getElementById('alert-msg').innerText = data.message;

            // Voice Synthesis (Hands-free alert)
            if ('speechSynthesis' in window) {
                const speech = new SpeechSynthesisUtterance("Attention driver. A passenger is waiting ahead.");
                speech.rate = 1;
                speech.pitch = 1;
                window.speechSynthesis.speak(speech);
            }
        });

        function acknowledge() {
            if(currentPingPlate) {
                socket.emit('driver_acknowledge', { plate: currentPingPlate });
                document.getElementById('alert-box').style.display = 'none';
                currentPingPlate = null;
            }
        }
    </script>
</body>
</html>
