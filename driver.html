<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PARA-PO Driver</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--panel:#1e1e1e;--line:#333;--text:#fff;--dim:#888;--green:#a3e635;--red:#ef4444;--amber:#fbbf24}
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#login{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px}
#login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#login h1{margin:0 0 4px;font-size:28px}
#login p{margin:0 0 12px;color:var(--dim);font-size:14px}
label{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
input,select{padding:14px;border-radius:10px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--green)}
#plate{text-transform:uppercase}
.go{background:var(--green);color:#000;border:none;padding:16px;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}
#login-err{color:#fca5a5;font-size:14px;min-height:20px}
.hint{font-size:12px;color:var(--dim);min-height:14px}
.link{background:none;border:none;color:var(--green);cursor:pointer;font-size:13px;text-align:left;padding:0}
#map-wrap{height:36vh;position:relative;flex-shrink:0}
#map{height:100%;background:#1a1a1a;filter:brightness(.85) contrast(1.1)}
#top{position:absolute;top:12px;left:12px;right:12px;z-index:1000;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.chip{background:rgba(30,30,30,.9);backdrop-filter:blur(10px);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--line);pointer-events:auto;display:flex;align-items:center;gap:8px}
.chip select{padding:6px 8px;font-size:14px;border-radius:6px}
#gps-dot{width:10px;height:10px;border-radius:50%;background:var(--amber)}
#gps-dot.ok{background:var(--green)}#gps-dot.bad{background:var(--red)}
#panel{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
#alert{display:none;width:100%;max-width:560px;background:rgba(239,68,68,.15);border:1px solid var(--red);border-radius:16px;padding:20px;text-align:center}
#alert-msg{font-size:22px;font-weight:700;margin-bottom:14px;animation:flash 1s infinite}
#ack{background:var(--green);color:#000;border:none;padding:16px 36px;font-size:18px;border-radius:12px;font-weight:700;cursor:pointer}
.cap{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
.count-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count-row .lbl{color:var(--dim);font-size:14px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid #444;background:#2a2a2a;color:#fff;font-size:26px;cursor:pointer}
.stepper button:active{background:#333}
#count{font-size:32px;font-weight:700;min-width:96px;text-align:center}
#full-btn{padding:16px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;border:1px solid}
#full-btn.open{background:rgba(163,230,53,.15);color:var(--green);border-color:var(--green)}
#full-btn.full{background:rgba(239,68,68,.2);color:var(--red);border-color:var(--red)}
#full-note{font-size:13px;color:var(--dim);text-align:center;margin-top:-6px;min-height:16px}
#end{background:none;border:1px solid #444;color:var(--dim);padding:12px 20px;border-radius:10px;cursor:pointer;font-size:14px}
#err{width:100%;max-width:560px;display:none;background:rgba(251,191,36,.12);border:1px solid var(--amber);color:#fde68a;padding:12px 14px;border-radius:10px;font-size:14px}
.road-label-wrap{background:none;border:none}
.road-label{transform:translate(-50%,-50%);display:inline-block;white-space:nowrap;color:#000;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;border:2px solid #0b0b0b;box-shadow:0 4px 12px rgba(0,0,0,.55)}
@keyframes flash{50%{opacity:.6}}
@media(prefers-reduced-motion:reduce){#alert-msg{animation:none}}
</style>
</head>
<body>
<div id="login">
  <form id="login-form">
    <h1>Start your shift</h1>
    <p>Passengers see your jeepney on the map once you start sharing your location.</p>
    <label>Driver key<input id="key" type="password" autocomplete="off" placeholder="Leave blank if none was set"></label>
    <label>Test jeepney (demo)<select id="test-select"><option value="">None, use my own plate</option></select></label>
    <div class="hint" id="test-hint"></div>
    <button type="button" class="link" id="refresh-tests">Refresh test jeepneys</button>
    <label>Plate number<input id="plate" maxlength="20" autocomplete="off" placeholder="e.g. ABC 123"></label>
    <label>Route<select id="route-login"><option>UNASSIGNED</option><option>AYALA</option><option>SINNUNUC</option></select></label>
    <div id="login-err" role="alert"></div>
    <button class="go">Start sharing location</button>
  </form>
</div>

<div id="map-wrap">
  <div id="top">
    <div class="chip"><span id="gps-dot"></span><span id="driver-id">—</span></div>
    <div class="chip">Route <select id="route"><option>UNASSIGNED</option><option>AYALA</option><option>SINNUNUC</option></select></div>
  </div>
  <div id="map"></div>
</div>

<div id="panel">
  <div id="err" role="alert"></div>
  <div id="alert" role="alert">
    <div id="alert-msg"></div>
    <button id="ack">✅ I see them</button>
  </div>
  <div class="cap">
    <div class="count-row">
      <span class="lbl">Passengers on board</span>
      <div class="stepper">
        <button id="minus" aria-label="One fewer passenger">−</button>
        <span id="count">0 / 20</span>
        <button id="plus" aria-label="One more passenger">+</button>
      </div>
    </div>
    <button id="full-btn" class="open">Mark as full</button>
    <div id="full-note"></div>
  </div>
  <button id="end">End shift</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const socket = io();
const map = L.map('map', { zoomControl: false, dragging: false, touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false }).setView([6.9273, 122.0588], 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
let marker = null, ring = null;

const SEND_MS = 4000;
let plate = null, key = '', route = 'UNASSIGNED';
let watchId = null, sendTimer = null, lastPos = null, lastSent = 0, wakeLock = null;
let st = { count: 0, max: 20, isFull: false, manualFull: false };
let active = false, testMode = false;
let pings = [];                       // waiting passengers: [{ id, lat, lon, ack }]
const lines = {}, pingMarkers = {};   // by passenger id

const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
$('plate').value = store.get('driverPlate');
$('route-login').value = store.get('driverRoute') || 'UNASSIGNED';

function say(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}
function showErr(msg) { const e = $('err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

/* ---------- route list (from the server) ---------- */
async function loadRoutes() {
  try {
    const r = await fetch('/api/routes');
    const j = await r.json();
    if (!j.routes || !j.routes.length) return;
    const ids = ['UNASSIGNED', ...j.routes.map(x => x.id)];
    for (const sel of [$('route-login'), $('route')]) {
      const cur = sel.value;
      sel.innerHTML = ids.map(id => `<option>${esc(id)}</option>`).join('');
      sel.value = ids.includes(cur) ? cur : 'UNASSIGNED';
    }
    const saved = store.get('driverRoute');
    if (saved && ids.includes(saved)) $('route-login').value = saved;
  } catch { /* keep the built-in options */ }
}
loadRoutes();

/* ---------- sign-in ---------- */
function register(cb) {
  socket.emit('driver_register', { plate, key }, res => cb && cb(!!(res && res.ok)));
}
$('login-form').onsubmit = e => {
  e.preventDefault();
  testMode = !!$('test-select').value;
  plate = (testMode ? $('test-select').value : $('plate').value).trim().toUpperCase();
  key = $('key').value;
  route = $('route-login').value;
  if (!/^[A-Z0-9 -]{2,20}$/.test(plate) || (!testMode && plate.startsWith('TEST-'))) { $('login-err').textContent = 'Enter a valid plate (letters, numbers, spaces or dashes; not TEST-).'; return; }
  if (!socket.connected) { $('login-err').textContent = 'Not connected to the server yet. Wait a moment and try again.'; return; }
  register(ok => {
    if (!ok) { $('login-err').textContent = testMode ? 'That test jeepney is gone, or the driver key was not accepted.' : 'The driver key was not accepted.'; return; }
    if (!testMode) { store.set('driverPlate', plate); store.set('driverRoute', route); }
    startShift();
  });
};

function startShift() {
  active = true;
  $('login').style.display = 'none';
  $('driver-id').textContent = testMode ? `${plate} · test` : plate;
  if (testMode) setGps('ok');      // the admin console moves test jeepneys, so no phone GPS
  else { $('route').value = route; startGps(); }
  requestWake();
  say('Shift started.');
}

$('end').onclick = () => {
  if (!confirm('End your shift? Passengers will stop seeing your jeepney.')) return;
  active = false;
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  clearInterval(sendTimer); watchId = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  location.reload();
};

// re-join the driver room after a dropped connection
socket.on('connect', () => { loadTests(); if (active) register(ok => { if (!ok) showErr('Lost authorization after reconnecting. Reload and sign in again.'); }); });
socket.on('disconnect', () => { if (active) showErr('Connection lost. Reconnecting…'); });
socket.io.on('reconnect', () => showErr(''));

/* ---------- road-following line with distance/time label ---------- */
function hav(a, b) {
  const R = 6371e3, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function pathLen(pts) { let t = 0; for (let i = 1; i < pts.length; i++) t += hav(pts[i - 1], pts[i]); return t; }
function pointAt(pts, target) {
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const seg = hav(pts[i - 1], pts[i]);
    if (seg > 0 && acc + seg >= target) {
      const f = (target - acc) / seg;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
    }
    acc += seg;
  }
  return pts[pts.length - 1];
}
const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';

// Keep only the part of the fetched road that is still AHEAD of the vehicle, so the remaining distance
// only shrinks as the jeepney approaches (instead of doubling back to where the road was fetched).
function trimFrom(coords, p) {
  if (coords.length < 2) return coords;
  const mx = 111320 * Math.cos(p[0] * Math.PI / 180), my = 110540;
  let best = Infinity, bi = 1, bp = coords[0];
  for (let i = 1; i < coords.length; i++) {
    const a = coords[i - 1], b = coords[i];
    const ax = (a[1] - p[1]) * mx, ay = (a[0] - p[0]) * my;
    const dx = (b[1] - p[1]) * mx - ax, dy = (b[0] - p[0]) * my - ay;
    const l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < best) { best = d; bi = i; bp = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  }
  return [bp, ...coords.slice(bi)];
}

class RoadLine {
  constructor(map, color, tag) {
    this.map = map; this.color = color; this.tag = tag || '';
    const base = { lineCap: 'round', lineJoin: 'round', interactive: false };
    this.casing = L.polyline([], { ...base, color: '#0b0b0b', weight: 13, opacity: .9 });
    this.line = L.polyline([], { ...base, color, weight: 7, opacity: 1 });
    this.label = L.marker([0, 0], { interactive: false, keyboard: false, zIndexOffset: 1000, icon: L.divIcon({ className: 'road-label-wrap', html: '', iconSize: [0, 0] }) });
    this.road = null; this.shown = false; this.pending = false; this.fetchedAt = 0; this.fa = null; this.fb = null; this.token = 0; this.len = 0;
  }
  update(a, b) {            // a: jeepney [lat, lon], b: passenger [lat, lon]
    this.a = a; this.b = b;
    if (!this.shown) { this.casing.addTo(this.map); this.line.addTo(this.map); this.label.addTo(this.map); this.shown = true; }
    const moved = !this.fa || hav(a, this.fa) > 15 || hav(b, this.fb) > 15;
    if (!this.pending && Date.now() - this.fetchedAt > 4000 && (moved || !this.road)) this.fetchRoad();
    this.draw();
  }
  async fetchRoad() {
    const tok = this.token, a = this.a, b = this.b;
    this.pending = true; this.fetchedAt = Date.now(); this.fa = a; this.fb = b;
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
      const j = await r.json();
      if (tok === this.token && j.routes && j.routes[0]) {
        const rt = j.routes[0];
        this.road = { coords: rt.geometry.coordinates.map(c => [c[1], c[0]]), distance: rt.distance, duration: rt.duration };
        this.draw();
      }
    } catch (e) { console.error('Routing error', e); }
    if (tok === this.token) this.pending = false;
  }
  draw() {
    if (!this.shown) return;
    const hasRoad = !!this.road;
    const pts = hasRoad ? [this.a, ...trimFrom(this.road.coords, this.a), this.b] : [this.a, this.b];
    const len = pathLen(pts);
    this.len = len;
    const secs = hasRoad ? len * (this.road.duration / Math.max(this.road.distance, 1)) : len / 5.55; // fallback ~20 km/h
    this.casing.setLatLngs(pts);
    this.line.setLatLngs(pts);
    this.line.setStyle({ dashArray: hasRoad ? null : '12,12' });
    const mins = Math.max(1, Math.ceil(secs / 60));
    const text = `${esc(this.tag)}${hasRoad ? '' : '~'}${mins} min · ${fmtDist(len)}${hasRoad ? '' : ' (straight line)'}`;
    this.label.setLatLng(pointAt(pts, len / 2)).setIcon(L.divIcon({ className: 'road-label-wrap', iconSize: [0, 0], html: `<div class="road-label" style="background:${this.color}">${text}</div>` }));
  }
  clear() {
    this.token++; this.pending = false; this.road = null; this.fetchedAt = 0; this.fa = this.fb = null; this.len = 0;
    if (this.shown) { this.map.removeLayer(this.casing); this.map.removeLayer(this.line); this.map.removeLayer(this.label); }
    this.shown = false;
  }
}

/* ---------- waiting passengers on the map ---------- */
const personIcon = L.divIcon({ html: '<div style="font-size:30px;filter:drop-shadow(0 0 5px #fbbf24)">🧍</div>', iconSize: [30, 30], iconAnchor: [15, 15], className: '' });
function syncPings() {
  for (const id of Object.keys(lines)) {
    if (!pings.some(p => p.id === id)) { lines[id].clear(); delete lines[id]; }
  }
  for (const id of Object.keys(pingMarkers)) {
    if (!pings.some(p => p.id === id)) { map.removeLayer(pingMarkers[id]); delete pingMarkers[id]; }
  }
  for (const p of pings) {
    if (pingMarkers[p.id]) pingMarkers[p.id].setLatLng([p.lat, p.lon]);
    else pingMarkers[p.id] = L.marker([p.lat, p.lon], { icon: personIcon }).addTo(map);
    if (!lastPos) continue;
    if (!lines[p.id]) lines[p.id] = new RoadLine(map, '#fbbf24', '');
    lines[p.id].update([lastPos.lat, lastPos.lon], [p.lat, p.lon]);
  }
}
socket.on('driver_pings', d => {
  if (d.plate !== plate) return;
  pings = Array.isArray(d.passengers) ? d.passengers : [];
  if (lastPos) drawMe(); else syncPings();
});

/* ---------- GPS -> server ---------- */
function setGps(state) { $('gps-dot').className = state; }
function startGps() {
  if (!navigator.geolocation) { showErr('This device has no GPS support.'); setGps('bad'); return; }
  watchId = navigator.geolocation.watchPosition(onPos, err => {
    setGps('bad');
    showErr(err.code === 1 ? 'Location permission is blocked. Allow location for this site, then reload.' : 'Waiting for a GPS signal…');
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  sendTimer = setInterval(() => { if (lastPos && Date.now() - lastSent >= SEND_MS - 200) send(); }, SEND_MS);
}
function onPos(p) {
  lastPos = { lat: p.coords.latitude, lon: p.coords.longitude };
  setGps('ok'); if ($('err').textContent.includes('GPS') || $('err').textContent.includes('Waiting')) showErr('');
  drawMe();
  if (Date.now() - lastSent >= SEND_MS) send();
}
async function send() {
  if (!lastPos || !active || testMode) return;
  lastSent = Date.now();
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (key) headers['x-driver-key'] = key;
    const r = await fetch('/api/update', { method: 'POST', headers, body: JSON.stringify({ plate, route, lat: lastPos.lat, lon: lastPos.lon }) });
    if (r.status === 401) { setGps('bad'); showErr('The server rejected your driver key.'); }
    else if (!r.ok) { setGps('bad'); showErr(`Location update failed (${r.status}).`); }
    else { setGps('ok'); if (/rejected|failed/.test($('err').textContent)) showErr(''); }
  } catch { setGps('bad'); showErr('Could not reach the server. Retrying…'); }
}
function drawMe() {
  const ll = [lastPos.lat, lastPos.lon];
  if (pings.length) map.fitBounds(L.latLngBounds([ll, ...pings.map(p => [p.lat, p.lon])]).pad(0.3), { maxZoom: 17, animate: false });
  else map.setView(ll, 17);
  if (marker) marker.setLatLng(ll);
  else marker = L.marker(ll, { icon: L.divIcon({ html: '<div style="font-size:40px;filter:drop-shadow(0 0 10px #a3e635)">🚐</div>', iconSize: [40, 40], iconAnchor: [20, 20], className: '' }) }).addTo(map);
  if (ring) ring.setLatLng(ll);
  else ring = L.circle(ll, { color: '#a3e635', fillColor: '#a3e635', fillOpacity: .1, weight: 1, radius: 100 }).addTo(map);
  syncPings();
}
async function requestWake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (active && document.visibilityState === 'visible') requestWake(); });

/* ---------- test jeepney selection (demo mode) ---------- */
function syncPlateField() {
  const t = $('test-select').value;
  $('plate').disabled = !!t;
  $('plate').value = t || store.get('driverPlate');
}
function loadTests() {
  if (!socket.connected) return;
  socket.emit('driver_test_list', { key: $('key').value }, res => {
    const sel = $('test-select'), cur = sel.value;
    sel.innerHTML = '<option value="">None, use my own plate</option>';
    if (res && res.ok) for (const j of res.jeepneys) {
      const o = document.createElement('option');
      o.value = j.plate; o.textContent = `${j.plate} (${(typeof j.route === 'string' && j.route) || 'no route'})`;
      sel.appendChild(o);
    }
    sel.value = [...sel.options].some(o => o.value === cur) ? cur : '';
    $('test-hint').textContent = !(res && res.ok) ? 'Enter the driver key to see test jeepneys.' : res.jeepneys.length ? '' : 'No test jeepneys yet. Place one from the admin console.';
    syncPlateField();
  });
}
$('test-select').onchange = syncPlateField;
$('refresh-tests').onclick = loadTests;
$('key').onchange = loadTests;

// a test jeepney is moved from the admin console: follow it here
socket.on('test_jeepney_update', d => {
  if (!testMode || d.plate !== plate) return;
  lastPos = { lat: d.lat, lon: d.lon };
  if (typeof d.route === 'string' && [...$('route').options].some(o => o.value === d.route)) { $('route').value = d.route; route = d.route; }
  drawMe();
});
function testGone(p) {
  if (!testMode || p !== plate) return;
  showErr('This test jeepney was removed. Returning to sign-in…');
  setTimeout(() => location.reload(), 2500);
}
socket.on('test_jeepney_deleted', testGone);
socket.on('alert_cleared', d => { if (d.plate === plate) $('alert').style.display = 'none'; }); // the line stays until the passenger boards or cancels

/* ---------- route ---------- */
$('route').onchange = () => {
  route = $('route').value;
  socket.emit('driver_update_route', { plate, route });
  store.set('driverRoute', route);
};

/* ---------- capacity ---------- */
function renderCap() {
  $('count').textContent = `${st.count} / ${st.max}`;
  const b = $('full-btn');
  b.className = st.isFull ? 'full' : 'open';
  b.textContent = st.manualFull ? 'Marked full · tap to reopen' : st.isFull ? 'Full (all seats taken)' : 'Mark as full';
  $('full-note').textContent = st.isFull && !st.manualFull ? 'Lower the count when passengers get off to reopen.' : '';
}
function applyStatus(s) { if (s) { st = s; renderCap(); } }
socket.on('initial_status', data => { if (plate) applyStatus(data[plate]); });
socket.on('status_update', d => { if (d.plate === plate) { const prev = st.count; applyStatus(d.status); if (d.status.count !== prev) say(`${d.status.count} passengers`); } });
$('plus').onclick = () => socket.emit('driver_set_count', { plate, count: st.count + 1 });
$('minus').onclick = () => socket.emit('driver_set_count', { plate, count: st.count - 1 });
$('full-btn').onclick = () => socket.emit('toggle_full', { plate, isFull: !st.manualFull });

/* ---------- passenger alerts ---------- */
socket.on('driver_alert', d => {
  if (d.plate !== plate) return;
  $('alert-msg').textContent = `🔔 ${d.message}`;
  $('alert').style.display = 'block';
  say(d.message);
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
});
socket.on('ping_cancelled', d => {
  if (d.plate !== plate) return;
  if (d.remaining > 0) $('alert-msg').textContent = `🔔 ${d.remaining} passenger(s) still waiting`;
  else $('alert').style.display = 'none';
});
$('ack').onclick = () => { socket.emit('driver_acknowledge', { plate }); $('alert').style.display = 'none'; };
</script>
</body>
</html>
