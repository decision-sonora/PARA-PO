<!DOCTYPE html>
<html>
<head>
    <title>PARA-PO Driver Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lora', serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; background: radial-gradient(circle at 50% 50%, #1a0500 0%, #050000 100%); overflow: hidden; background-image: radial-gradient(circle at 50% 50%, rgba(255, 80, 0, 0.1) 0%, transparent 60%), radial-gradient(#ffffff 1px, transparent 1px); background-size: 100% 100%, 30px 30px;}
        #map-container { height: 45vh; width: 100%; position: relative; border-bottom: 2px solid rgba(255,100,50,0.3);}
        #map { height: 100%; width: 100%; background: #1a0500; }
        #alert-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #e6d5c3; text-align: center; padding: 30px; }
        
        #capacity-panel { background: rgba(20, 5, 0, 0.8); backdrop-filter: blur(10px); padding: 20px 40px; border-radius: 15px; border: 1px solid rgba(255, 100, 50, 0.4); display: flex; align-items: center; gap: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #pass-count { font-size: 28px; font-weight: bold; color: #ff6b35; font-family: 'Playfair Display', serif;}
        #full-status { font-size: 20px; font-weight: bold; padding: 12px 25px; border-radius: 8px; cursor: pointer; user-select: none; transition: 0.3s; font-family: 'Lora', serif;}
        .status-full { background: linear-gradient(135deg, #a60000, #ff0040); color: white; box-shadow: 0 0 15px rgba(255,0,64,0.5);}
        .status-open { background: linear-gradient(135deg, #ffaa00, #ff6600); color: #1a0500; box-shadow: 0 0 15px rgba(255,150,0,0.3);}

        #stop-alert { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(166, 0, 0, 0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; backdrop-filter: blur(5px);}
        #stop-alert h1 { font-size: 70px; margin: 0; animation: flash 0.5s infinite; font-family: 'Playfair Display', serif; text-shadow: 0 5px 15px rgba(0,0,0,0.5);}
        #stop-alert p { font-size: 32px; margin: 15px 0; font-weight: bold; }
        #stop-btn { background: #1a0500; color: #ffaa00; border: 2px solid #ffaa00; padding: 25px 50px; font-size: 26px; border-radius: 15px; cursor: pointer; font-weight: bold; margin-top: 30px; transition: 0.3s; font-family: 'Lora', serif;}
        #stop-btn:hover { background: #ffaa00; color: #1a0500; }

        #alert-banner { display: none; background: linear-gradient(135deg, #ff4d00, #cc3300); color: white; padding: 25px; border-radius: 15px; font-size: 26px; font-weight: bold; animation: flash 1s infinite; text-align: center; margin-bottom: 25px; width: 90%; max-width: 600px; box-shadow: 0 10px 30px rgba(255, 60, 0, 0.4); font-family: 'Playfair Display', serif;}
        #ack-btn { display: none; background: #e6d5c3; color: #1a0500; border: none; padding: 20px 45px; font-size: 24px; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(255,255,255,0.3); transition: 0.3s; font-family: 'Lora', serif;}
        #ack-btn:hover { transform: scale(1.05); }
        
        #top-bar { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000; display: flex; justify-content: space-between; pointer-events: none; }
        .top-panel { background: rgba(20, 5, 0, 0.85); backdrop-filter: blur(8px); color: #e6d5c3; padding: 12px 20px; border-radius: 10px; font-weight: bold; pointer-events: auto; border: 1px solid rgba(255, 100, 50, 0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.5);}
        .top-panel select { margin-left: 12px; padding: 8px; border-radius: 6px; font-weight: bold; background: rgba(255, 80, 0, 0.2); color: white; border: 1px solid rgba(255,100,50,0.4); outline: none; font-family: 'Lora', serif;}

        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a0500 0%, #050000 100%); z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #login-modal h2 { color: #ff6b35; font-family: 'Playfair Display', serif; font-size: 36px; text-shadow: 0 4px 10px rgba(0,0,0,0.5);}
        #jeepney-list { display: flex; flex-direction: column; gap: 15px; max-height: 60vh; overflow-y: auto; padding: 25px; }
        .jeep-btn { background: rgba(255, 255, 255, 0.05); color: #e6d5c3; border: 1px solid rgba(255, 100, 50, 0.3); padding: 18px 35px; font-size: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; min-width: 280px; font-family: 'Lora', serif; box-shadow: 0 5px 15px rgba(0,0,0,0.3); backdrop-filter: blur(10px);}
        .jeep-btn:hover { border-color: #ff6b35; background: rgba(255, 80, 0, 0.15); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255, 60, 0, 0.3); }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,100,50,0.4); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="login-modal">
        <h2>Select Your Jeepney</h2>
        <p style="color: #a3968b; font-size: 18px;">Choose the vehicle you are currently driving:</p>
        <div id="jeepney-list"></div>
    </div>

    <div id="stop-alert">
        <h1>🛑 STOP!</h1>
        <p>Passenger is within 10 meters.</p>
        <button id="stop-btn" onclick="dismissStopAlert()">✅ OK, I SEE THEM</button>
    </div>

    <div id="map-container">
        <div id="top-bar">
            <div class="top-panel" id="driver-id">Driver: None</div>
            <div class="top-panel">
                Route: 
                <select id="route-select" onchange="updateRoute()">
                    <option value="UNASSIGNED">UNASSIGNED</option>
                    <option value="AYALA">AYALA</option>
                    <option value="SINNUNUC">SINNUNUC</option>
                </select>
            </div>
        </div>
        <div id="map"></div>
    </div>
    
    <div id="alert-area">
        <div id="capacity-panel">
            <div style="font-size: 20px; font-weight: bold;">Passengers: <span id="pass-count">0 / 20</span></div>
            <div id="full-status" class="status-open" onclick="toggleFullStatus()">NOT FULL</div>
        </div>

        <div id="alert-banner">🔔 PASSENGER WAITING NEARBY!</div>
        <button id="ack-btn" onclick="acknowledge()">✅ I SEE THEM</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { 
            dragging: false, zoomControl: false, touchZoom: false, 
            scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false
        }).setView([6.9273, 122.0588], 17);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const socket = io();
        let driverMarker = null;
        let geofenceCircle = null;
        let selectedPlate = null;
        let availableJeeps = {};
        
        let passengers = {};
        let passengerLayerGroup = L.layerGroup().addTo(map);
        let currentJeepLat = null, currentJeepLon = null;
        let stopAlertActive = false;

        let currentCount = 0;
        const MAX_CAPACITY = 20;
        let isFull = false;

        function selectJeepney(plate) {
            selectedPlate = plate;
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('driver-id').innerText = `Driver: ${plate}`;
            
            if(availableJeeps[plate]) {
                document.getElementById('route-select').value = availableJeeps[plate].route;
                currentJeepLat = availableJeeps[plate].lat;
                currentJeepLon = availableJeeps[plate].lon;
                map.setView([currentJeepLat, currentJeepLon], 17);
                updateDriverMap();
            }
            if ('speechSynthesis' in window) {
                let u = new SpeechSynthesisUtterance("Jeepney selected.");
                window.speechSynthesis.speak(u);
            }
        }

        function updateCapacityDisplay() {
            document.getElementById('pass-count').innerText = `${currentCount} / ${MAX_CAPACITY}`;
            const statusDiv = document.getElementById('full-status');
            if(isFull) {
                statusDiv.innerText = "FULL";
                statusDiv.className = "status-full";
            } else {
                statusDiv.innerText = "NOT FULL";
                statusDiv.className = "status-open";
            }
        }

        function toggleFullStatus() {
            isFull = !isFull;
            updateCapacityDisplay();
            socket.emit('toggle_full', { plate: selectedPlate, isFull: isFull });
        }

        socket.on('initial_status', (data) => {
            if(data[selectedPlate]) {
                currentCount = data[selectedPlate].count;
                isFull = data[selectedPlate].isFull;
                updateCapacityDisplay();
            }
        });

        socket.on('status_update', (data) => {
            if(data.plate === selectedPlate) {
                currentCount = data.status.count;
                isFull = data.status.isFull;
                updateCapacityDisplay();
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const speech = new SpeechSynthesisUtterance("Passenger count updated.");
                    window.speechSynthesis.speak(speech);
                }
            }
        });

        function updateRoute() {
            if (!selectedPlate) return;
            const newRoute = document.getElementById('route-select').value;
            socket.emit('driver_update_route', { plate: selectedPlate, route: newRoute });
            if(availableJeeps[selectedPlate]) availableJeeps[selectedPlate].route = newRoute;
        }

        function updateJeepneyList() {
            const listDiv = document.getElementById('jeepney-list');
            listDiv.innerHTML = '';
            let count = 0;

            for (let plate in availableJeeps) {
                count++;
                const btn = document.createElement('button');
                btn.className = 'jeep-btn';
                btn.innerText = `${plate} (${availableJeeps[plate].route})`;
                btn.onclick = () => selectJeepney(plate);
                listDiv.appendChild(btn);
            }

            if (count === 0) listDiv.innerHTML = '<p style="color: #a3968b; font-size: 18px;">Waiting for jeepneys...</p>';
        }

        socket.on('initial_jeepneys', (data) => { for (let plate in data) availableJeeps[plate] = data[plate]; updateJeepneyList(); });
        socket.on('initial_test_jeepneys', (data) => { for (let plate in data) availableJeeps[plate] = data[plate]; updateJeepneyList(); });
        socket.on('initial_test_passengers', (data) => {
            for (let id in data) passengers[id] = data[id];
            updatePassengerMarkers();
        });

        socket.on('jeepney_update', (data) => {
            availableJeeps[data.plate] = data;
            updateJeepneyList(); 
            if (data.plate === selectedPlate) {
                currentJeepLat = data.lat;
                currentJeepLon = data.lon;
                updateDriverMap();
            }
        });

        socket.on('test_jeepney_update', (data) => {
            availableJeeps[data.plate] = data;
            updateJeepneyList();
            if (data.plate === selectedPlate) {
                currentJeepLat = data.lat;
                currentJeepLon = data.lon;
                updateDriverMap();
            }
        });

        socket.on('passenger_location_update', (data) => {
            passengers['real'] = data;
            updatePassengerMarkers();
        });

        socket.on('test_passenger_update', (data) => {
            passengers[data.id] = data;
            updatePassengerMarkers();
        });

        socket.on('test_passenger_deleted', (id) => {
            delete passengers[id];
            updatePassengerMarkers();
        });

        function updatePassengerMarkers() {
            passengerLayerGroup.clearLayers();
            for (let id in passengers) {
                const p = passengers[id];
                const icon = L.divIcon({ html: '<div style="font-size:30px;">🧍</div>', iconSize: [30, 30], className: '' });
                L.marker([p.lat, p.lon], {icon: icon}).addTo(passengerLayerGroup).bindPopup("Passenger");
            }
            checkProximity();
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function checkProximity() {
            if (currentJeepLat === null || currentJeepLon === null) return;
            let closestDist = Infinity;
            for (let id in passengers) {
                const p = passengers[id];
                const d = getDistance(currentJeepLat, currentJeepLon, p.lat, p.lon);
                if (d < closestDist) closestDist = d;
            }
            
            if (closestDist >= 1 && closestDist <= 10) {
                if (!stopAlertActive) {
                    stopAlertActive = true;
                    document.getElementById('stop-alert').style.display = 'flex';
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const speech = new SpeechSynthesisUtterance("Passenger is within 10 meters. Prepare to stop.");
                        speech.rate = 1; 
                        window.speechSynthesis.speak(speech);
                    }
                }
            } else {
                stopAlertActive = false;
                document.getElementById('stop-alert').style.display = 'none';
            }
        }

        function dismissStopAlert() {
            stopAlertActive = true; 
            document.getElementById('stop-alert').style.display = 'none';
        }

        function updateDriverMap() {
            if(currentJeepLat === null) return;
            map.setView([currentJeepLat, currentJeepLon], 17);

            if (driverMarker) driverMarker.setLatLng([currentJeepLat, currentJeepLon]);
            else {
                const icon = L.divIcon({ html: '<div style="font-size:40px; filter: drop-shadow(0 0 10px rgba(255,80,0,0.8));">🚐</div>', iconSize: [40, 40], className: '' });
                driverMarker = L.marker([currentJeepLat, currentJeepLon], {icon: icon}).addTo(map);
            }

            if (geofenceCircle) map.removeLayer(geofenceCircle);
            geofenceCircle = L.circle([currentJeepLat, currentJeepLon], { color: '#ff6b35', fillColor: '#ff6b35', fillOpacity: 0.15, radius: 100 }).addTo(map);
            
            checkProximity();
        }

        socket.on('driver_alert', (data) => {
            if (data.plate !== selectedPlate) return;

            document.getElementById('alert-banner').style.display = 'block';
            document.getElementById('alert-banner').innerText = `🔔 ${data.message}`;
            document.getElementById('ack-btn').style.display = 'inline-block';

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(data.message);
                speech.rate = 1; speech.pitch = 1;
                window.speechSynthesis.speak(speech);
            }
        });

        function acknowledge() {
            if (selectedPlate) socket.emit('driver_acknowledge', { plate: selectedPlate });
            document.getElementById('alert-banner').style.display = 'none';
            document.getElementById('ack-btn').style.display = 'none';
        }
    </script>
</body>
</html>
