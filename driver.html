<!DOCTYPE html>
<html>
<head>
    <title>PARA-PO Driver Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; background: #1e1e2f; }
        #map-container { height: 45vh; width: 100%; position: relative; }
        #map { height: 100%; width: 100%; }
        #alert-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; }
        #alert-banner { display: none; background: #fd5d93; color: white; padding: 30px; border-radius: 15px; font-size: 28px; font-weight: bold; animation: flash 1s infinite; text-align: center; margin-bottom: 20px; width: 90%; max-width: 600px;}
        #ack-btn { display: none; background: #00f2c3; color: #1e1e2f; border: none; padding: 20px 40px; font-size: 24px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        /* Top Bar for Route Selection */
        #top-bar { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000; display: flex; justify-content: space-between; pointer-events: none; }
        .top-panel { background: rgba(30, 30, 47, 0.9); color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold; pointer-events: auto; border: 1px solid #00f2c3; }
        .top-panel select { margin-left: 10px; padding: 5px; border-radius: 5px; font-weight: bold; }

        /* Login Modal */
        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1e1e2f; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #login-modal h2 { color: #00f2c3; }
        #jeepney-list { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding: 20px; }
        .jeep-btn { background: #27293d; color: white; border: 2px solid #444; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; min-width: 250px;}
        .jeep-btn:hover { border-color: #00f2c3; background: #333; }

        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal">
        <h2>Select Your Jeepney</h2>
        <p>Choose the vehicle you are currently driving:</p>
        <div id="jeepney-list"></div>
    </div>

    <!-- Main Dashboard -->
    <div id="map-container">
        <div id="top-bar">
            <div class="top-panel" id="driver-id">Driver: None</div>
            <div class="top-panel">
                Route: 
                <select id="route-select" onchange="updateRoute()">
                    <option value="UNASSIGNED">UNASSIGNED</option>
                    <option value="AYALA">AYALA</option>
                    <option value="SINNUNUC">SINNUNUC</option>
                </select>
            </div>
        </div>
        <div id="map"></div>
    </div>
    
    <div id="alert-area">
        <div id="alert-banner">🔔 PASSENGER WAITING NEARBY!</div>
        <button id="ack-btn" onclick="acknowledge()">✅ I SEE THEM</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([6.9273, 122.0588], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const socket = io();
        let driverMarker = null;
        let geofenceCircle = null;
        let selectedPlate = null;
        let availableJeeps = {};

        // Initialize Map
        function selectJeepney(plate) {
            selectedPlate = plate;
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('driver-id').innerText = `Driver: ${plate}`;
            
            // Set the dropdown to the jeepney's current route
            if(availableJeeps[plate]) {
                document.getElementById('route-select').value = availableJeeps[plate].route;
            }

            // Unlock TTS on user interaction
            if ('speechSynthesis' in window) {
                let u = new SpeechSynthesisUtterance("Jeepney selected.");
                window.speechSynthesis.speak(u);
            }
        }

        function updateRoute() {
            if (!selectedPlate) return;
            const newRoute = document.getElementById('route-select').value;
            socket.emit('driver_update_route', { plate: selectedPlate, route: newRoute });
            
            if(availableJeeps[selectedPlate]) availableJeeps[selectedPlate].route = newRoute;
        }

        function updateJeepneyList() {
            const listDiv = document.getElementById('jeepney-list');
            listDiv.innerHTML = '';
            let count = 0;

            for (let plate in availableJeeps) {
                count++;
                const btn = document.createElement('button');
                btn.className = 'jeep-btn';
                btn.innerText = `${plate} (${availableJeeps[plate].route})`;
                btn.onclick = () => selectJeepney(plate);
                listDiv.appendChild(btn);
            }

            if (count === 0) {
                listDiv.innerHTML = '<p style="color: #aaa;">Waiting for jeepneys to connect...</p>';
            }
        }

        // --- Real-time Data Listeners ---
        socket.on('initial_jeepneys', (data) => {
            for (let plate in data) availableJeeps[plate] = data[plate];
            updateJeepneyList();
        });

        socket.on('initial_test_jeepneys', (data) => {
            for (let plate in data) availableJeeps[plate] = data[plate];
            updateJeepneyList();
        });

        socket.on('jeepney_update', (data) => {
            availableJeeps[data.plate] = data;
            updateJeepneyList(); // Update list so route changes reflect
            
            if (data.plate === selectedPlate) updateDriverMap(data.lat, data.lon);
        });

        socket.on('test_jeepney_update', (data) => {
            availableJeeps[data.plate] = data;
            updateJeepneyList();
            
            if (data.plate === selectedPlate) updateDriverMap(data.lat, data.lon);
        });

        socket.on('test_jeepney_deleted', (plate) => {
            delete availableJeeps[plate];
            updateJeepneyList();
            if (selectedPlate === plate) {
                alert("The jeepney you were tracking was removed by the admin.");
                location.reload();
            }
        });

        socket.on('driver_alert', (data) => {
            if (data.plate !== selectedPlate) return; // Only alert if it's for THIS driver

            document.getElementById('alert-banner').style.display = 'block';
            document.getElementById('alert-banner').innerText = `🔔 ${data.message}`;
            document.getElementById('ack-btn').style.display = 'inline-block';

            // TTS FIX: Cancel any stuck speech before speaking
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(data.message);
                speech.rate = 1; speech.pitch = 1;
                window.speechSynthesis.speak(speech);
            }

            setTimeout(() => {
                document.getElementById('alert-banner').style.display = 'none';
                document.getElementById('ack-btn').style.display = 'none';
            }, 15000);
        });

        function updateDriverMap(lat, lon) {
            map.setView([lat, lon], 16);

            if (driverMarker) driverMarker.setLatLng([lat, lon]);
            else {
                const icon = L.divIcon({ html: '🚐', iconSize: [40, 40], className: '' });
                driverMarker = L.marker([lat, lon], {icon: icon}).addTo(map);
            }

            if (geofenceCircle) map.removeLayer(geofenceCircle);
            geofenceCircle = L.circle([lat, lon], { color: '#00f2c3', fillColor: '#00f2c3', fillOpacity: 0.2, radius: 100 }).addTo(map);
        }

        function acknowledge() {
            if (selectedPlate) socket.emit('driver_acknowledge', { plate: selectedPlate });
            document.getElementById('alert-banner').style.display = 'none';
            document.getElementById('ack-btn').style.display = 'none';
        }
    </script>
</body>
</html>
