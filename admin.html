<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin - PARA-PO Demo Console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--panel:rgba(30,30,30,.92);--line:#333;--text:#fff;--dim:#a0a0a0;--green:#a3e635;--red:#ef4444;--amber:#fbbf24}
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;height:100vh;height:100dvh;overflow:hidden}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#map{position:absolute;inset:0;z-index:1;filter:brightness(.85) contrast(1.1)}
#sidebar{position:absolute;top:16px;left:16px;bottom:16px;width:390px;padding:20px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;border:1px solid var(--line);z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow-y:auto}
h2{margin:0 0 14px;font-size:21px;font-weight:600;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
#conn{width:12px;height:12px;border-radius:50%;background:var(--red)}
#conn.on{background:var(--green);box-shadow:0 0 10px var(--green)}
h3{font-size:13px;color:var(--dim);font-weight:600;margin:18px 0 8px}
select,input[type=password]{width:100%;padding:10px;border-radius:8px;background:#121212;color:#fff;border:1px solid var(--line);outline:none;font-size:13px}
.btn{padding:10px 12px;font-size:13px;border:1px solid #444;border-radius:8px;cursor:pointer;font-weight:600;background:#2a2a2a;color:#fff;transition:.15s}
.btn:hover{background:#333}
.btn.block{width:100%;margin-bottom:8px}
.btn.on{box-shadow:0 0 0 2px var(--green)}
.btn.on.pass{box-shadow:0 0 0 2px var(--red)}
.btn.go{background:var(--green);color:#000;border:none}
.btn.go:hover{background:#bcf258}
.btn.warn{background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.35)}
.btn.sm{padding:7px 10px;font-size:12px}
.toggle{display:flex;align-items:flex-start;gap:10px;font-size:13px;margin-bottom:10px;cursor:pointer;line-height:1.35}
.toggle input{margin-top:2px;accent-color:#a3e635}
.toggle small{display:block;color:var(--dim)}
.item{background:#121212;padding:10px 12px;margin-bottom:8px;border-radius:8px;font-size:13px;border:1px solid #2a2a2a}
.item.alerting{border-color:var(--red)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row select{flex:1;min-width:120px;width:auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;background:rgba(163,230,53,.15);color:var(--green);white-space:nowrap}
.badge.full{background:rgba(239,68,68,.2);color:var(--red)}
.badge.ping{background:rgba(251,191,36,.15);color:var(--amber)}
.alertbox{margin-top:8px;padding:8px 10px;border-radius:6px;background:rgba(239,68,68,.15);color:#fca5a5;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.none{color:#777;font-size:13px;margin-bottom:8px}
#log{font-size:12px;color:var(--dim);max-height:130px;overflow-y:auto;border-top:1px solid var(--line);padding-top:8px;line-height:1.5}
#log div:first-child{color:var(--green)}
#login{position:fixed;inset:0;z-index:10000;background:var(--bg);display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px}
#login form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
#login h1{margin:0;font-size:26px}
#login-err{color:#fca5a5;font-size:14px;min-height:20px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#444;border-radius:10px}
.road-label-wrap{background:none;border:none}
.road-label{transform:translate(-50%,-50%);display:inline-block;white-space:nowrap;color:#000;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;border:2px solid #0b0b0b;box-shadow:0 4px 12px rgba(0,0,0,.55)}
@media(max-width:768px){#sidebar{top:auto;bottom:0;left:0;width:100%;height:58vh;border-radius:20px 20px 0 0;border-width:1px 0 0;padding:14px}}
</style>
</head>
<body>
<div id="login">
  <form id="login-form">
    <h1>Admin sign-in</h1>
    <input id="token" type="password" placeholder="Admin token" autocomplete="off" required>
    <div id="login-err" role="alert"></div>
    <button class="btn go">Sign in</button>
  </form>
</div>

<div id="sidebar">
  <h2><span id="conn"></span>Demo Console</h2>

  <h3>Demo options</h3>
  <label class="toggle"><input type="checkbox" id="public"><span>Show test jeepneys to commuters<small>Lets a phone on the passenger page ping and ride them. Alerts for test jeepneys appear here.</small></span></label>
  <label class="toggle"><input type="checkbox" id="auto"><span>Auto-drive to pinging passengers<small>Follows real roads (needs internet for routing).</small></span></label>
  <label class="toggle"><input type="checkbox" id="autoboard" checked><span>Auto-board when the jeepney arrives<small>Only for test passengers.</small></span></label>

  <h3>Set up</h3>
  <button id="scenario" class="btn block go">▶ Load demo scenario (2 jeepneys, 2 passengers)</button>
  <select id="route" aria-label="Route for new test jeepneys" style="margin-bottom:8px"><option>AYALA</option><option>SINNUNUC</option><option>UNASSIGNED</option></select>
  <button id="btn-jeep" class="btn block">📍 Place test jeepney</button>
  <button id="btn-pass" class="btn block pass">🧍 Place test passenger</button>
  <button id="btn-clear" class="btn block warn">🗑️ Clear all test objects</button>

  <h3>Test jeepneys (you are the driver)</h3>
  <div id="jeeps"></div>

  <h3>Test passengers</h3>
  <div id="pass"></div>

  <h3>Live jeepneys (real drivers / ESP)</h3>
  <div id="live"></div>

  <h3>Activity</h3>
  <div id="log" aria-live="polite"></div>
</div>
<div id="map"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routeLabel = r => (typeof r === 'string' && r) ? r : (r ? 'Custom' : 'Not set');
let ROUTES = ['AYALA', 'SINNUNUC', 'UNASSIGNED'];   // replaced by the server's route list below

const map = L.map('map', { zoomControl: false }).setView([6.9273, 122.0588], 15);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

const socket = io();
const status = {}, liveJeeps = {}, liveMarkers = {};
const testJeeps = {}, testMarkers = {}, testPass = {}, passMarkers = {}, lines = {};
const alerts = {}, sel = {}, moveTimers = {};
let mode = null;

const emoji = (e, size) => L.divIcon({ html: `<div style="font-size:${size}px;filter:drop-shadow(0 0 5px rgba(0,0,0,.6))">${e}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], className: '' });
function log(msg) {
  const d = document.createElement('div');
  d.textContent = `${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}  ${msg}`;
  $('log').prepend(d);
  while ($('log').children.length > 40) $('log').lastChild.remove();
}

/* ---------- route list (from the server) ---------- */
const OTHER = '__other__';
const cleanRouteName = s => String(s || '').replace(/[^A-Za-z0-9 .,'&()\/-]/g, '').replace(/\s+/g, ' ').trim().toUpperCase().slice(0, 40);
// the server's routes, plus any custom route in use, plus "type your own"
function routeOptionsHtml(current) {
  const ids = (typeof current === 'string' && current && !ROUTES.includes(current)) ? [current, ...ROUTES] : ROUTES;
  return ids.map(r => `<option ${current === r ? 'selected' : ''}>${esc(r)}</option>`).join('') + `<option value="${OTHER}">Other (type your own)…</option>`;
}
// returns the chosen route name, or null if the admin cancelled
function askCustomRoute() {
  const name = cleanRouteName(prompt('Type the route name (for example: SAN ROQUE - DIVISORIA).') || '');
  return name || null;
}
function fillNewRouteSelect(value) { $('route').innerHTML = routeOptionsHtml(value); $('route').value = value; }
async function loadRoutes() {
  try {
    const r = await fetch('/api/routes');
    const j = await r.json();
    if (j.routes && j.routes.length) ROUTES = [...j.routes.map(x => x.id), 'UNASSIGNED'];
  } catch { /* keep the built-in list */ }
  fillNewRouteSelect(ROUTES.includes($('route').value) ? $('route').value : ROUTES[0]);
  renderJeeps();
}
loadRoutes();
let newRoutePrev = 'AYALA';
$('route').onfocus = () => { newRoutePrev = $('route').value; };
$('route').onchange = () => {
  if ($('route').value !== OTHER) return;
  fillNewRouteSelect(askCustomRoute() || newRoutePrev);
};

/* ---------- auth ---------- */
const tok = { get() { try { return sessionStorage.getItem('adminToken') || ''; } catch { return ''; } }, set(v) { try { sessionStorage.setItem('adminToken', v); } catch {} } };
function login(token) {
  socket.emit('admin_login', token, res => {
    if (res && res.ok) { tok.set(token); $('login').style.display = 'none'; log('Signed in.'); }
    else { $('login').style.display = 'flex'; $('login-err').textContent = token ? 'That token was not accepted.' : ''; }
  });
}
socket.on('connect', () => { $('conn').className = 'on'; login(tok.get()); });
socket.on('disconnect', () => { $('conn').className = ''; log('Disconnected. Reconnecting…'); });
$('login-form').onsubmit = e => { e.preventDefault(); login($('token').value); };

/* ---------- road-following line with distance/time label ---------- */
function hav(a, b) {
  const R = 6371e3, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function pathLen(pts) { let t = 0; for (let i = 1; i < pts.length; i++) t += hav(pts[i - 1], pts[i]); return t; }
function pointAt(pts, target) {
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const seg = hav(pts[i - 1], pts[i]);
    if (seg > 0 && acc + seg >= target) {
      const f = (target - acc) / seg;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f];
    }
    acc += seg;
  }
  return pts[pts.length - 1];
}
const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';

// Keep only the part of the fetched road that is still AHEAD of the vehicle, so the remaining distance
// only shrinks as the jeepney approaches (instead of doubling back to where the road was fetched).
function trimFrom(coords, p) {
  if (coords.length < 2) return coords;
  const mx = 111320 * Math.cos(p[0] * Math.PI / 180), my = 110540;
  let best = Infinity, bi = 1, bp = coords[0];
  for (let i = 1; i < coords.length; i++) {
    const a = coords[i - 1], b = coords[i];
    const ax = (a[1] - p[1]) * mx, ay = (a[0] - p[0]) * my;
    const dx = (b[1] - p[1]) * mx - ax, dy = (b[0] - p[0]) * my - ay;
    const l2 = dx * dx + dy * dy;
    const t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < best) { best = d; bi = i; bp = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  }
  return [bp, ...coords.slice(bi)];
}

// Draws jeepney -> passenger along the road (OSRM). Shows a dashed straight line until the road arrives
// or if routing fails. The label stays live between route refreshes.
class RoadLine {
  constructor(map, color, tag) {
    this.map = map; this.color = color; this.tag = tag || '';
    const base = { lineCap: 'round', lineJoin: 'round', interactive: false };
    this.casing = L.polyline([], { ...base, color: '#0b0b0b', weight: 13, opacity: .9 });
    this.line = L.polyline([], { ...base, color, weight: 7, opacity: 1 });
    this.label = L.marker([0, 0], { interactive: false, keyboard: false, zIndexOffset: 1000, icon: L.divIcon({ className: 'road-label-wrap', html: '', iconSize: [0, 0] }) });
    this.road = null; this.shown = false; this.pending = false; this.fetchedAt = 0; this.fa = null; this.fb = null; this.token = 0; this.len = 0;
  }
  update(a, b) {            // a: jeepney [lat, lon], b: passenger [lat, lon]
    this.a = a; this.b = b;
    if (!this.shown) { this.casing.addTo(this.map); this.line.addTo(this.map); this.label.addTo(this.map); this.shown = true; }
    const moved = !this.fa || hav(a, this.fa) > 15 || hav(b, this.fb) > 15;
    if (!this.pending && Date.now() - this.fetchedAt > 4000 && (moved || !this.road)) this.fetchRoad();
    this.draw();
  }
  async fetchRoad() {
    const tok = this.token, a = this.a, b = this.b;
    this.pending = true; this.fetchedAt = Date.now(); this.fa = a; this.fb = b;
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
      const j = await r.json();
      if (tok === this.token && j.routes && j.routes[0]) {
        const rt = j.routes[0];
        this.road = { coords: rt.geometry.coordinates.map(c => [c[1], c[0]]), distance: rt.distance, duration: rt.duration };
        this.draw();
      }
    } catch (e) { console.error('Routing error', e); }
    if (tok === this.token) this.pending = false;
  }
  draw() {
    if (!this.shown) return;
    const hasRoad = !!this.road;
    const pts = hasRoad ? [this.a, ...trimFrom(this.road.coords, this.a), this.b] : [this.a, this.b];
    const len = pathLen(pts);
    this.len = len;
    const secs = hasRoad ? len * (this.road.duration / Math.max(this.road.distance, 1)) : len / 5.55; // fallback ~20 km/h
    this.casing.setLatLngs(pts);
    this.line.setLatLngs(pts);
    this.line.setStyle({ dashArray: hasRoad ? null : '12,12' });
    const mins = Math.max(1, Math.ceil(secs / 60));
    const text = `${esc(this.tag)}${hasRoad ? '' : '~'}${mins} min · ${fmtDist(len)}${hasRoad ? '' : ' (straight line)'}`;
    this.label.setLatLng(pointAt(pts, len / 2)).setIcon(L.divIcon({ className: 'road-label-wrap', iconSize: [0, 0], html: `<div class="road-label" style="background:${this.color}">${text}</div>` }));
  }
  clear() {
    this.token++; this.pending = false; this.road = null; this.fetchedAt = 0; this.fa = this.fb = null; this.len = 0;
    if (this.shown) { this.map.removeLayer(this.casing); this.map.removeLayer(this.line); this.map.removeLayer(this.label); }
    this.shown = false;
  }
}

/* ---------- helpers ---------- */
const allJeeps = () => ({ ...liveJeeps, ...testJeeps });
function jeepLatLng(plate) {
  const m = testMarkers[plate] || liveMarkers[plate];
  return m ? m.getLatLng() : null;
}
function nearestJeep(p) {
  let best = null, bd = Infinity;
  for (const plate in allJeeps()) {
    const ll = jeepLatLng(plate); if (!ll) continue;
    const d = map.distance([p.lat, p.lon], ll);
    if (d < bd) { bd = d; best = plate; }
  }
  return best;
}
function syncLines() {
  for (const id in lines) if (!testPass[id] || testPass[id].pingPlate !== lines[id].plate) { lines[id].clear(); delete lines[id]; }
  for (const id in testPass) {
    const p = testPass[id], ll = p.pingPlate && jeepLatLng(p.pingPlate);
    if (!ll) continue;
    if (!lines[id]) { lines[id] = new RoadLine(map, '#fbbf24', `${id} · `); lines[id].plate = p.pingPlate; }
    lines[id].update([ll.lat, ll.lng], [p.lat, p.lon]);
  }
}

/* ---------- live jeepneys ---------- */
function renderLive() {
  const plates = Object.keys(liveJeeps);
  $('live').innerHTML = plates.length ? plates.map(p => {
    const s = status[p] || { count: 0, max: 20, isFull: false };
    return `<div class="item"><div class="head"><b>🚌 ${esc(p)}</b><span class="badge ${s.isFull ? 'full' : ''}">${s.isFull ? 'FULL ' : ''}${s.count}/${s.max}</span></div><div style="color:var(--dim);margin-top:4px">${esc(routeLabel(liveJeeps[p].route))}</div></div>`;
  }).join('') : '<div class="none">No real drivers online. Use test jeepneys to demo.</div>';
}
function upsertLive(d) {
  if (!d || !d.plate) return;
  const isNew = !liveJeeps[d.plate];
  liveJeeps[d.plate] = d;
  const ll = [d.lat, d.lon];
  if (liveMarkers[d.plate]) liveMarkers[d.plate].setLatLng(ll);
  else liveMarkers[d.plate] = L.marker(ll, { icon: emoji('🚌', 26) }).addTo(map).bindPopup(`Live: ${esc(d.plate)}`);
  renderLive(); syncLines();
  if (isNew) renderPass();
}
function removeLive(plate) {
  if (liveMarkers[plate]) map.removeLayer(liveMarkers[plate]);
  delete liveMarkers[plate]; delete liveJeeps[plate]; delete status[plate];
  renderLive(); renderPass(); log(`${plate} went offline.`);
}
socket.on('initial_jeepneys', data => {
  for (const p of Object.keys(liveJeeps)) if (!(p in data)) removeLive(p);
  for (const p in data) upsertLive(data[p]);
});
socket.on('initial_status', data => { Object.assign(status, data); renderAll(); });
socket.on('status_update', ({ plate, status: s }) => { status[plate] = s; renderAll(); });
socket.on('jeepney_update', upsertLive);
socket.on('jeepney_removed', removeLive);

/* ---------- placing ---------- */
function setMode(m) {
  mode = mode === m ? null : m;
  $('btn-jeep').classList.toggle('on', mode === 'jeepney');
  $('btn-pass').classList.toggle('on', mode === 'passenger');
  if (mode) log(`Click the map to place a test ${mode}.`);
}
$('btn-jeep').onclick = () => setMode('jeepney');
$('btn-pass').onclick = () => setMode('passenger');
map.on('click', e => {
  if (!mode) return;
  const { lat, lng } = e.latlng;
  if (mode === 'jeepney') socket.emit('admin_place_test_jeepney', { lat, lon: lng, route: $('route').value });
  else socket.emit('admin_place_test_passenger', { lat, lon: lng });
  mode = null; $('btn-jeep').classList.remove('on'); $('btn-pass').classList.remove('on');
});
$('btn-clear').onclick = () => { if (confirm('Remove all test jeepneys and passengers?')) { stopMoves(); socket.emit('admin_clear_all'); } };
$('scenario').onclick = () => {
  const c = map.getCenter();
  const jeeps = [[0.0030, -0.0030, 'AYALA'], [-0.0030, 0.0040, 'SINNUNUC']];
  const pass = [[0, 0], [-0.0010, 0.0020]];
  for (const [dy, dx, route] of jeeps) socket.emit('admin_place_test_jeepney', { lat: c.lat + dy, lon: c.lng + dx, route });
  for (const [dy, dx] of pass) socket.emit('admin_place_test_passenger', { lat: c.lat + dy, lon: c.lng + dx });
  log('Scenario loaded. Ping from a passenger card, then answer the alert on the jeepney card.');
};
$('public').onchange = e => socket.emit('admin_set_public_test', e.target.checked);
socket.on('test_public_state', v => { $('public').checked = !!v; log(v ? 'Commuters can now see test jeepneys.' : 'Test jeepneys are hidden from commuters.'); });

/* ---------- test jeepneys ---------- */
function renderJeeps() {
  const plates = Object.keys(testJeeps);
  $('jeeps').innerHTML = plates.length ? plates.map(plate => {
    const s = status[plate] || { count: 0, max: 20, isFull: false, manualFull: false };
    const a = alerts[plate];
    const cur = testJeeps[plate].route;
    return `<div class="item ${a ? 'alerting' : ''}" data-plate="${esc(plate)}">
      <div class="head"><b>🚐 ${esc(plate)}</b><span class="badge ${s.isFull ? 'full' : ''}">${s.isFull ? 'FULL ' : ''}${s.count}/${s.max}</span></div>
      <div class="row">
        <select data-act="route" aria-label="Route">${routeOptionsHtml(cur)}</select>
        <button class="btn sm" data-act="minus" aria-label="One fewer passenger">−</button>
        <button class="btn sm" data-act="plus" aria-label="One more passenger">+</button>
        <button class="btn sm ${s.manualFull ? 'warn' : ''}" data-act="full">${s.manualFull ? 'Reopen' : 'Mark full'}</button>
        <button class="btn sm warn" data-act="remove">Remove</button>
      </div>
      ${a ? `<div class="alertbox"><span>🔔 ${esc(a)}</span><button class="btn sm go" data-act="ack">I see them</button></div>` : ''}
    </div>`;
  }).join('') : '<div class="none">None yet. Load the demo scenario or place one.</div>';
}
function jeepAction(plate, act, value) {
  const s = status[plate] || { count: 0, manualFull: false };
  if (act === 'route') socket.emit('driver_update_route', { plate, route: value });
  else if (act === 'plus') socket.emit('driver_set_count', { plate, count: s.count + 1 });
  else if (act === 'minus') socket.emit('driver_set_count', { plate, count: s.count - 1 });
  else if (act === 'full') socket.emit('toggle_full', { plate, isFull: !s.manualFull });
  else if (act === 'ack') { socket.emit('driver_acknowledge', { plate }); delete alerts[plate]; renderJeeps(); log(`${plate} driver acknowledged the passengers.`); }
  else if (act === 'remove') { if (moveTimers[plate]) { clearInterval(moveTimers[plate]); delete moveTimers[plate]; } socket.emit('admin_delete_test_jeepney', plate); }
}
$('jeeps').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  jeepAction(b.closest('[data-plate]').dataset.plate, b.dataset.act);
});
$('jeeps').addEventListener('change', e => {
  const s = e.target.closest('select[data-act]'); if (!s) return;
  const plate = s.closest('[data-plate]').dataset.plate;
  if (s.value === OTHER) {
    const name = askCustomRoute();
    if (!name) { renderJeeps(); return; }   // cancelled: put the dropdown back
    return jeepAction(plate, 'route', name);
  }
  jeepAction(plate, 'route', s.value);
});

function addTestJeep(d) {
  const prev = testJeeps[d.plate];
  testJeeps[d.plate] = d;
  if (!testMarkers[d.plate]) {
    const m = L.marker([d.lat, d.lon], { icon: emoji('🚐', 28), draggable: true }).addTo(map).bindPopup(`Test jeepney: ${esc(d.plate)}`);
    m.on('dragend', ev => { const p = ev.target.getLatLng(); socket.emit('admin_move_test_jeepney', { plate: d.plate, lat: p.lat, lng: p.lng, lon: p.lng }); });
    testMarkers[d.plate] = m;
  } else if (!moveTimers[d.plate]) testMarkers[d.plate].setLatLng([d.lat, d.lon]);
  if (!prev || prev.route !== d.route) { renderJeeps(); renderPass(); }
  syncLines();
}
socket.on('initial_test_jeepneys', data => { for (const p in data) addTestJeep(data[p]); });
socket.on('test_jeepney_update', addTestJeep);
socket.on('test_jeepney_deleted', plate => {
  if (testMarkers[plate]) map.removeLayer(testMarkers[plate]);
  delete testMarkers[plate]; delete testJeeps[plate]; delete alerts[plate]; delete status[plate];
  renderJeeps(); renderPass(); syncLines();
});

/* ---------- test passengers ---------- */
function renderPass() {
  const ids = Object.keys(testPass);
  const jeepList = Object.keys(allJeeps());
  $('pass').innerHTML = ids.length ? ids.map(id => {
    const p = testPass[id];
    if (!jeepList.includes(sel[id])) sel[id] = nearestJeep(p) || '';
    const state = p.boarded ? `<span class="badge">Riding ${esc(p.boarded)}</span>` : p.pingPlate ? `<span class="badge ping">Pinging ${esc(p.pingPlate)}</span>` : '<span class="badge" style="background:#2a2a2a;color:#aaa">Waiting</span>';
    const opts = jeepList.map(pl => {
      const ll = jeepLatLng(pl), d = ll ? Math.round(map.distance([p.lat, p.lon], ll)) : null;
      return `<option value="${esc(pl)}" ${sel[id] === pl ? 'selected' : ''}>${esc(pl)}${d !== null ? ` (${d} m)` : ''}</option>`;
    }).join('');
    const picker = jeepList.length ? `<select data-act="pick" aria-label="Jeepney">${opts}</select>` : '';
    let btns;
    if (p.boarded) btns = '<button class="btn sm" data-act="down">Get off</button>';
    else if (p.pingPlate) btns = '<button class="btn sm" data-act="cancel">Cancel ping</button><button class="btn sm go" data-act="board">Board</button>';
    else btns = '<button class="btn sm go" data-act="ping">📢 Ping</button><button class="btn sm" data-act="board">Board</button>';
    return `<div class="item" data-id="${esc(id)}"><div class="head"><b>🧍 ${esc(id)}</b>${state}</div>
      <div class="row">${picker}${btns}<button class="btn sm warn" data-act="remove">Remove</button></div></div>`;
  }).join('') : '<div class="none">None yet.</div>';
}
$('pass').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.closest('[data-id]').dataset.id, plate = sel[id];
  const act = b.dataset.act;
  if (act === 'ping') { if (!plate) return log('Add a jeepney first.'); socket.emit('admin_test_ping', { id, plate }); }
  else if (act === 'cancel') socket.emit('admin_test_cancel_ping', { id });
  else if (act === 'board') { if (!plate) return log('Add a jeepney first.'); socket.emit('admin_test_board', { id, plate }); }
  else if (act === 'down') socket.emit('admin_test_disembark', { id });
  else if (act === 'remove') socket.emit('admin_delete_test_passenger', id);
});
$('pass').addEventListener('change', e => {
  const s = e.target.closest('select[data-act="pick"]'); if (!s) return;
  sel[s.closest('[data-id]').dataset.id] = s.value;
});

function addTestPass(d) {
  const prev = testPass[d.id];
  testPass[d.id] = d;
  if (!passMarkers[d.id]) {
    const m = L.marker([d.lat, d.lon], { icon: emoji('🧍', 28), draggable: true }).addTo(map).bindPopup(`Test passenger: ${esc(d.id)}`);
    m.on('dragend', ev => {
      const p = ev.target.getLatLng();
      if (testPass[d.id].boarded) return m.setLatLng([testPass[d.id].lat, testPass[d.id].lon]); // riders can't be dragged off
      socket.emit('admin_move_test_passenger', { id: d.id, lat: p.lat, lon: p.lng });
    });
    passMarkers[d.id] = m;
  } else passMarkers[d.id].setLatLng([d.lat, d.lon]);
  passMarkers[d.id].setOpacity(d.boarded ? 0 : 1);
  if (!prev || prev.boarded !== d.boarded || prev.pingPlate !== d.pingPlate) renderPass();
  syncLines();
}
socket.on('initial_test_passengers', data => { for (const p in data) addTestPass(data[p]); });
socket.on('test_passenger_update', addTestPass);
socket.on('test_passenger_deleted', id => {
  if (passMarkers[id]) map.removeLayer(passMarkers[id]);
  delete passMarkers[id]; delete testPass[id]; delete sel[id];
  renderPass(); syncLines();
});
socket.on('clear_all_test_objects', () => {
  for (const m of [...Object.values(testMarkers), ...Object.values(passMarkers)]) map.removeLayer(m);
  for (const o of [testMarkers, passMarkers, testJeeps, testPass, alerts, sel]) for (const k of Object.keys(o)) delete o[k];
  stopMoves(); renderJeeps(); renderPass(); syncLines(); log('Cleared all test objects.');
});

/* ---------- alerts and ping feedback ---------- */
socket.on('driver_alert', d => {
  if (!testJeeps[d.plate]) return;          // real drivers handle their own alerts
  alerts[d.plate] = d.message; renderJeeps();
  log(`${d.plate}: ${d.message}`);
});
socket.on('ping_cancelled', d => {
  if (!testJeeps[d.plate]) return;
  if (d.remaining > 0) alerts[d.plate] = `${d.remaining} passenger(s) still waiting`; else delete alerts[d.plate];
  renderJeeps(); log(`A ping to ${d.plate} was cancelled.`);
});
socket.on('alert_cleared', d => { if (alerts[d.plate]) { delete alerts[d.plate]; renderJeeps(); log(`${d.plate} driver acknowledged.`); } });
socket.on('test_ping_acknowledged', d => log(`${d.id} saw that ${d.plate} acknowledged.`));
socket.on('test_ping_expired', d => { delete alerts[d.plate]; renderJeeps(); log(`${d.id}'s ping to ${d.plate} ended (${d.reason}).`); });
socket.on('test_ping_result', r => {
  if (r.error) log(`${r.id}: ${r.error}`);
  else log(`${r.id} pinged ${r.plate} from ${Math.round(r.distance)} m${r.driverOnline ? '' : ' (no driver online)'}.`);
});

/* ---------- auto-drive ---------- */
function stopMoves() { for (const p of Object.keys(moveTimers)) { clearInterval(moveTimers[p]); delete moveTimers[p]; } }
$('auto').onchange = e => { if (!e.target.checked) stopMoves(); };
async function roadRoute(aLat, aLon, bLat, bLon) {
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${aLon},${aLat};${bLon},${bLat}?geometries=geojson&overview=full`);
    const j = await r.json();
    if (j.routes && j.routes.length) return j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
  } catch (e) { console.error('Routing error', e); }
  return [[aLat, aLon], [bLat, bLon]];
}
socket.on('admin_route_to_passenger', async ({ plate, passLat, passLon, passengerId }) => {
  if (!$('auto').checked || !testMarkers[plate]) return; // only test jeepneys can be driven from here
  const start = testMarkers[plate].getLatLng();
  log(`${plate} is driving to the passenger…`);
  const path = await roadRoute(start.lat, start.lng, passLat, passLon);
  if (moveTimers[plate]) clearInterval(moveTimers[plate]);
  let i = 0;
  moveTimers[plate] = setInterval(() => {
    if (!$('auto').checked || !testMarkers[plate] || i >= path.length) {
      clearInterval(moveTimers[plate]); delete moveTimers[plate];
      if ($('auto').checked && testMarkers[plate]) {
        log(`${plate} arrived.`);
        if (passengerId && $('autoboard').checked && testPass[passengerId] && !testPass[passengerId].boarded) socket.emit('admin_test_board', { id: passengerId, plate });
      }
      return;
    }
    const [lat, lon] = path[i++];
    testMarkers[plate].setLatLng([lat, lon]);
    socket.emit('admin_move_test_jeepney', { plate, lat, lon });
    syncLines();
  }, 500);
});

function renderAll() { renderJeeps(); renderLive(); renderPass(); }
renderAll();
</script>
</body>
