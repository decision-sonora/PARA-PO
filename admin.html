<!DOCTYPE html>
<html>
<head>
    <title>Admin - PARA-PO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: rgba(30, 30, 30, 0.85);
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-green: #a3e635;
            --accent-red: #ef4444;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-primary); 
            padding: 0; 
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        #map { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: brightness(0.85) contrast(1.1);
        }

        #sidebar { 
            position: absolute;
            top: 20px;
            left: 20px;
            bottom: 20px;
            width: 360px; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            background: var(--panel-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px; 
            border: 1px solid var(--border-color);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;}
        h2::before { content: ''; display: block; width: 12px; height: 12px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }

        select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            font-family: 'Inter', sans-serif; 
            background: #121212; 
            color: white; 
            border: 1px solid var(--border-color); 
            outline: none;
            font-weight: 500;
            box-sizing: border-box;
        }

        p { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-bottom: 8px; }

        button { 
            width: 100%; 
            padding: 14px; 
            font-size: 14px; 
            margin-bottom: 10px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-family: 'Inter', sans-serif; 
            transition: all 0.2s ease; 
            box-sizing: border-box;
        }

        .btn-jeep { background: #2a2a2a; color: white; border: 1px solid #444; }
        .btn-jeep:hover { background: #333; border-color: var(--accent-green); }
        
        .btn-pass { background: #2a2a2a; color: white; border: 1px solid #444; }
        .btn-pass:hover { background: #333; border-color: var(--accent-red); }
        
        .btn-auto { background: rgba(163, 230, 53, 0.1); color: var(--accent-green); border: 1px solid rgba(163, 230, 53, 0.3); }
        .btn-auto:hover { background: rgba(163, 230, 53, 0.2); }
        
        .btn-clear { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); margin-top: 10px;}
        .btn-clear:hover { background: rgba(239, 68, 68, 0.2); }

        .active-mode { box-shadow: 0 0 0 2px var(--accent-green); }
        .active-mode-red { box-shadow: 0 0 0 2px var(--accent-red); }

        #status { margin: 15px 0; font-size: 13px; color: var(--accent-green); font-weight: 600; min-height: 20px;}

        .delete-list { flex-grow: 1; overflow-y: auto; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .delete-item { display: flex; justify-content: space-between; align-items: center; background: #121212; padding: 12px; margin-bottom: 8px; border-radius: 8px; font-size: 13px; border: 1px solid #2a2a2a;}
        .delete-btn { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; width: auto; margin: 0; font-size: 12px; font-weight: 600;}
        .delete-btn:hover { background: rgba(239, 68, 68, 0.3); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #sidebar {
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 55vh;
                border-radius: 20px 20px 0 0;
                border-bottom: none;
                border-left: none;
                border-right: none;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Admin Hub</h2>
        <select id="admin-route">
            <option value="AYALA">Ayala Route</option>
            <option value="SINNUNUC">Sinnunuc Route</option>
        </select>

        <p>1. Select mode:</p>
        <button id="btn-jeep" class="btn-jeep" onclick="setMode('jeepney')">📍 Place Test Jeepney</button>
        <button id="btn-pass" class="btn-pass" onclick="setMode('passenger')">🧍 Place Test Passenger</button>
        
        <p style="margin-top: 15px;">2. Click map to place.</p>
        
        <button id="btn-auto" class="btn-auto" onclick="toggleAutoMove()">🚦 Start Auto-Move (Follow Road)</button>
        <button class="btn-clear" onclick="socket.emit('admin_clear_all')">🗑️ Clear All Entities</button>

        <p id="status">Status: Ready.</p>
        <div class="delete-list" id="delete-list"></div>
    </div>
    <div id="map"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([6.9273, 122.0588], 14);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const socket = io();
        let currentMode = null;
        let markers = {}; 
        let isAutoMoving = false;
        let moveIntervals = {};

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('status').innerText = `Mode: Click map to place ${mode}`;
            document.getElementById('btn-jeep').classList.remove('active-mode');
            document.getElementById('btn-pass').classList.remove('active-mode-red');
            if(mode === 'jeepney') document.getElementById('btn-jeep').classList.add('active-mode');
            if(mode === 'passenger') document.getElementById('btn-pass').classList.add('active-mode-red');
        }

        map.on('click', (e) => {
            if (!currentMode) return;
            if(currentMode === 'jeepney') {
                socket.emit('admin_place_test_jeepney', { lat: e.latlng.lat, lon: e.latlng.lng, route: document.getElementById('admin-route').value });
            } else if (currentMode === 'passenger') {
                socket.emit('admin_place_test_passenger', { lat: e.latlng.lat, lon: e.latlng.lng });
            }
            currentMode = null;
            document.getElementById('status').innerText = "Status: Placed successfully!";
            document.getElementById('btn-jeep').classList.remove('active-mode');
            document.getElementById('btn-pass').classList.remove('active-mode-red');
        });

        async function getRoadRoute(startLat, startLon, endLat, endLon) {
            try {
                const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${endLon},${endLat}?geometries=geojson&overview=full`);
                const data = await res.json();
                if(data.routes && data.routes.length > 0) {
                    return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                }
            } catch(e) { console.error("Routing error", e); }
            return [[startLat, startLon], [endLat, endLon]]; 
        }

        function toggleAutoMove() {
            isAutoMoving = !isAutoMoving;
            const btn = document.getElementById('btn-auto');
            if (isAutoMoving) {
                btn.innerText = "🛑 Stop Auto-Move";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
                btn.style.color = "#ef4444";
                btn.style.borderColor = "#ef4444";
                document.getElementById('status').innerText = "Auto-Move Active. Jeepneys will drive to pinged passengers.";
            } else {
                btn.innerText = "🚦 Start Auto-Move (Follow Road)";
                btn.style.background = "rgba(163, 230, 53, 0.1)";
                btn.style.color = "#a3e635";
                btn.style.borderColor = "rgba(163, 230, 53, 0.3)";
                document.getElementById('status').innerText = "Auto-Move Stopped.";
                for(let plate in moveIntervals) { clearInterval(moveIntervals[plate]); }
                moveIntervals = {};
            }
        }

        socket.on('admin_route_to_passenger', async (data) => {
            if (!isAutoMoving) return;
            const plate = data.plate;
            if (markers[plate]) {
                document.getElementById('status').innerText = `Routing ${plate} to passenger...`;
                const start = markers[plate].getLatLng();
                
                const routePath = await getRoadRoute(start.lat, start.lng, data.passLat, data.passLon);
                let step = 0;

                if (moveIntervals[plate]) clearInterval(moveIntervals[plate]);
                
                moveIntervals[plate] = setInterval(() => {
                    if (!isAutoMoving || step >= routePath.length) {
                        clearInterval(moveIntervals[plate]);
                        delete moveIntervals[plate];
                        return;
                    }
                    const newPos = routePath[step];
                    markers[plate].setLatLng(newPos);
                    socket.emit('admin_move_test_jeepney', { plate: plate, lat: newPos[0], lon: newPos[1] });
                    step++;
                }, 500); 
            }
        });

        function createJeepMarker(data) {
            if (markers[data.plate]) return;
            const icon = L.divIcon({ html: '<div style="font-size: 24px; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));">🚐</div>', iconSize: [30, 30], className: '' });
            const marker = L.marker([data.lat, data.lon], {icon: icon, draggable: true}).addTo(map).bindPopup(`Test Jeep: ${data.plate}`);
            
            marker.on('dragend', (e) => {
                const newPos = e.target.getLatLng();
                setTimeout(() => { socket.emit('admin_move_test_jeepney', { plate: data.plate, lat: newPos.lat, lon: newPos.lng }); }, 50);
            });
            
            markers[data.plate] = marker;
            updateDeleteList();
        }

        function createPassengerMarker(data) {
            if (markers[data.id]) return;
            const icon = L.divIcon({ html: '<div style="font-size: 24px; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));">🧍</div>', iconSize: [30, 30], className: '' });
            markers[data.id] = L.marker([data.lat, data.lon], {icon: icon}).addTo(map).bindPopup(`Test Passenger: ${data.id}`);
            updateDeleteList();
        }

        socket.on('initial_test_jeepneys', (data) => { for (let plate in data) createJeepMarker(data[plate]); });
        socket.on('initial_test_passengers', (data) => { for (let id in data) createPassengerMarker(data[id]); });

        socket.on('test_jeepney_update', (data) => {
            if (!markers[data.plate]) createJeepMarker(data);
            else if (!moveIntervals[data.plate]) markers[data.plate].setLatLng([data.lat, data.lon]);
        });

        socket.on('test_passenger_update', (data) => { if (!markers[data.id]) createPassengerMarker(data); });

        socket.on('test_jeepney_deleted', (plate) => { if(markers[plate]) { map.removeLayer(markers[plate]); delete markers[plate]; updateDeleteList(); } });
        socket.on('test_passenger_deleted', (id) => { if(markers[id]) { map.removeLayer(markers[id]); delete markers[id]; updateDeleteList(); } });
        socket.on('clear_all_test_objects', () => {
            for(let id in markers) map.removeLayer(markers[id]);
            markers = {}; updateDeleteList();
            document.getElementById('status').innerText = "Status: Cleared all.";
        });

        function updateDeleteList() {
            const list = document.getElementById('delete-list');
            list.innerHTML = '';
            for (let id in markers) {
                const isJeep = id.startsWith('TEST');
                const div = document.createElement('div');
                div.className = 'delete-item';
                div.innerHTML = `<span>${isJeep ? '🚐 ' : '🧍 '}${id}</span>
                                 <button class="delete-btn" onclick="deleteItem('${id}', '${isJeep ? 'jeepney' : 'passenger'}')">REMOVE</button>`;
                list.appendChild(div);
            }
        }

        function deleteItem(id, type) {
            if(type === 'jeepney') socket.emit('admin_delete_test_jeepney', id);
            else socket.emit('admin_delete_test_passenger', id);
        }
    </script>
</body>
</html>
