<!DOCTYPE html>
<html>
<head>
    <title>Admin - PARA-PO</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial; background: #1e1e2f; color: white; padding: 20px; display: flex; height: 100vh; box-sizing: border-box; }
        #sidebar { width: 320px; padding-right: 20px; display: flex; flex-direction: column; }
        #map { flex-grow: 1; border-radius: 8px; border: 2px solid #00f2c3; }
        button { width: 100%; padding: 12px; font-size: 14px; margin-bottom: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-jeep { background: #00f2c3; color: #1e1e2f; }
        .btn-pass { background: #fd5d93; color: white; }
        .btn-clear { background: #444; color: white; }
        .active-mode { border: 3px solid white; }
        select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        #status { margin-top: 10px; font-size: 13px; color: #aaa; }
        .delete-list { flex-grow: 1; overflow-y: auto; margin-top: 15px; border-top: 1px solid #444; padding-top: 10px; }
        .delete-item { display: flex; justify-content: space-between; align-items: center; background: #27293d; padding: 8px; margin-bottom: 5px; border-radius: 5px; font-size: 13px;}
        .delete-btn { background: #fd5d93; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; width: auto; margin: 0;}
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>🛡️ Admin Hub</h2>
        <select id="admin-route">
            <option value="AYALA">Ayala Route</option>
            <option value="SINNUNUC">Sinnunuc Route</option>
        </select>

        <p>Select mode, then click map:</p>
        <button id="btn-jeep" class="btn-jeep" onclick="setMode('jeepney')">📍 Place Test Jeepney</button>
        <button id="btn-pass" class="btn-pass" onclick="setMode('passenger')">🧍 Place Test Passenger</button>
        <button class="btn-clear" onclick="socket.emit('admin_clear_all')">🗑️ Clear All</button>

        <p id="status">Mode: None selected.</p>

        <div class="delete-list" id="delete-list">
            <!-- Items will appear here -->
        </div>
    </div>
    <div id="map"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([6.9273, 122.0588], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const socket = io();
        let currentMode = null;
        let markers = {}; // Store all admin markers

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('status').innerText = "Mode: Click on the map to place the " + mode;
            document.getElementById('btn-jeep').classList.remove('active-mode');
            document.getElementById('btn-pass').classList.remove('active-mode');
            if(mode === 'jeepney') document.getElementById('btn-jeep').classList.add('active-mode');
            if(mode === 'passenger') document.getElementById('btn-pass').classList.add('active-mode');
        }

        map.on('click', (e) => {
            if(currentMode === 'jeepney') {
                socket.emit('admin_place_test_jeepney', { lat: e.latlng.lat, lon: e.latlng.lng, route: document.getElementById('admin-route').value });
                document.getElementById('status').innerText = "Test Jeepney placed!";
            } 
            else if (currentMode === 'passenger') {
                socket.emit('admin_place_test_passenger', { lat: e.latlng.lat, lon: e.latlng.lng });
                document.getElementById('status').innerText = "Test Passenger placed!";
            }
            currentMode = null;
            document.getElementById('btn-jeep').classList.remove('active-mode');
            document.getElementById('btn-pass').classList.remove('active-mode');
        });

        // --- Update Admin Map and Delete List ---
        socket.on('test_jeepney_update', (data) => {
            if (!markers[data.plate]) {
                const icon = L.divIcon({ html: '🚐', iconSize: [30, 30], className: '' });
                const marker = L.marker([data.lat, data.lon], {icon: icon, draggable: true}).addTo(map).bindPopup(`Test Jeep: ${data.plate}`);
                
                // Allow dragging to move the jeepney
                marker.on('dragend', (e) => {
                    const newPos = e.target.getLatLng();
                    socket.emit('admin_move_test_jeepney', { plate: data.plate, lat: newPos.lat, lon: newPos.lng });
                });
                
                markers[data.plate] = marker;
                updateDeleteList();
            } else {
                // Update marker position if moved remotely
                markers[data.plate].setLatLng([data.lat, data.lon]);
            }
        });

        socket.on('test_passenger_update', (data) => {
            if (!markers[data.id]) {
                const icon = L.divIcon({ html: '🧍', iconSize: [30, 30], className: '' });
                markers[data.id] = L.marker([data.lat, data.lon], {icon: icon}).addTo(map).bindPopup(`Test Passenger: ${data.id}`);
                updateDeleteList();
            }
        });

        socket.on('test_jeepney_deleted', (plate) => {
            if(markers[plate]) { map.removeLayer(markers[plate]); delete markers[plate]; updateDeleteList(); }
        });

        socket.on('test_passenger_deleted', (id) => {
            if(markers[id]) { map.removeLayer(markers[id]); delete markers[id]; updateDeleteList(); }
        });

        socket.on('clear_all_test_objects', () => {
            for(let id in markers) map.removeLayer(markers[id]);
            markers = {};
            updateDeleteList();
        });

        function updateDeleteList() {
            const list = document.getElementById('delete-list');
            list.innerHTML = '';
            for (let id in markers) {
                const isJeep = id.startsWith('TEST');
                const div = document.createElement('div');
                div.className = 'delete-item';
                div.innerHTML = `<span>${isJeep ? '🚐 ' : '🧍 '}${id}</span>
                                 <button class="delete-btn" onclick="deleteItem('${id}', '${isJeep ? 'jeepney' : 'passenger'}')">❌</button>`;
                list.appendChild(div);
            }
        }

        function deleteItem(id, type) {
            if(type === 'jeepney') socket.emit('admin_delete_test_jeepney', id);
            else socket.emit('admin_delete_test_passenger', id);
        }
    </script>
</body>
</html>
